<style>
/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 1 · ESTILOS
   ═══════════════════════════════════════════════════════════════ */

/* ── 1.1 Variables de tema ───────────────────────────────────── */
:root{
  --border:rgba(120,170,255,.16);
  --border2:rgba(120,170,255,.35);
  --text:#e9eff7;
  --muted:#8fa0b8;
  --accent:#58a6ff;
  --accent2:#a371f7;
  --good:#3fb950;
  --bad:#f85149;
  --gold:#e3b341;
}

/* ── 1.2 Reset y fondo aurora ────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:#05070f;color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  padding:20px 18px 28px;position:relative;overflow-x:hidden;min-height:100vh;
}
.bg{
  position:fixed;inset:-10%;z-index:-2;
  background:
    radial-gradient(ellipse 65% 50% at 12% -5%, rgba(88,166,255,.30), transparent 55%),
    radial-gradient(ellipse 55% 45% at 88% 10%, rgba(163,113,247,.26), transparent 55%),
    radial-gradient(ellipse 70% 45% at 50% 105%, rgba(63,185,80,.12), transparent 55%),
    radial-gradient(ellipse 40% 35% at 95% 95%, rgba(255,123,114,.10), transparent 60%),
    #05070f;
  animation:aurora 26s ease-in-out infinite alternate;
}
@keyframes aurora{0%{transform:scale(1)}100%{transform:scale(1.12) translate(-2%,-2%)}}
.bg::after{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(1px 1px at 8% 14%, rgba(255,255,255,.85), transparent 100%),
    radial-gradient(1px 1px at 22% 62%, rgba(255,255,255,.55), transparent 100%),
    radial-gradient(1px 1px at 41% 22%, rgba(255,255,255,.65), transparent 100%),
    radial-gradient(1.5px 1.5px at 62% 78%, rgba(255,255,255,.75), transparent 100%),
    radial-gradient(1px 1px at 74% 8%, rgba(255,255,255,.7), transparent 100%),
    radial-gradient(1px 1px at 88% 42%, rgba(255,255,255,.6), transparent 100%),
    radial-gradient(1px 1px at 55% 92%, rgba(255,255,255,.5), transparent 100%),
    radial-gradient(1.5px 1.5px at 32% 40%, rgba(255,255,255,.6), transparent 100%),
    radial-gradient(1px 1px at 92% 82%, rgba(255,255,255,.55), transparent 100%),
    radial-gradient(1px 1px at 4% 88%, rgba(255,255,255,.5), transparent 100%);
  animation:twinkle 7s ease-in-out infinite alternate;pointer-events:none;
}
@keyframes twinkle{0%,100%{opacity:.55}50%{opacity:1}}
.app{max-width:1180px;margin:0 auto;position:relative;z-index:1}

/* ── 1.3 HUD superior ────────────────────────────────────────── */
.hud{
  display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:10px;
  background:linear-gradient(180deg, rgba(28,36,50,.85), rgba(20,26,36,.72));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:18px;padding:16px 22px;
  margin-bottom:12px;align-items:center;
  box-shadow:0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
}
.hud-item{display:flex;flex-direction:column;gap:3px;position:relative}
.hud-item .label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hud-item .value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}

/* El número grande y el delta viven en la misma fila */
.hud-item.main .elo-row{
  display:flex;
  align-items:baseline;
  gap:14px;
  flex-wrap:wrap;
}
.hud-item.main .value{
  font-size:38px;line-height:1.05;
  background:linear-gradient(90deg,#7cc4ff,#c8a2ff 60%, #58a6ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(88,166,255,.35));
}
.hud-item.main .sub{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:2px}

/* Delta al lado del ELO: aparece, sube y se desvanece */
.delta{
  font-size:22px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  opacity:0;
  transform:translateY(6px) scale(.9);
  transition:opacity .28s ease, transform .28s ease;
  pointer-events:none;
  white-space:nowrap;
}
.delta.show{
  opacity:1;
  transform:translateY(0) scale(1);
  animation:pop .5s ease;
}
.delta.up{
  color:var(--good);
  text-shadow:0 0 16px rgba(63,185,80,.75), 0 0 4px rgba(63,185,80,.9);
}
.delta.down{
  color:var(--bad);
  text-shadow:0 0 16px rgba(248,81,73,.75), 0 0 4px rgba(248,81,73,.9);
}
@keyframes pop{
  0%  {transform:translateY(10px) scale(.7); opacity:0}
  60% {transform:translateY(-2px) scale(1.1); opacity:1}
  100%{transform:translateY(0) scale(1); opacity:1}
}

/* ── 1.4 Barra de selección de dataset (gist files) ──────────── */
.dataset-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 14px;margin-bottom:10px;
  background:linear-gradient(90deg, rgba(163,113,247,.10), rgba(88,166,255,.06));
  border:1px solid var(--border);border-radius:12px;
  font-size:12.5px;color:var(--muted);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.dataset-bar[hidden]{display:none}
.dataset-label{
  font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent2);white-space:nowrap;
}
.dataset-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dataset-chip{
  padding:5px 12px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:700;
  background:rgba(10,16,26,.6);border:1px solid var(--border);
  color:#c9d5e6;transition:.16s;font-family:inherit;letter-spacing:.02em;
}
.dataset-chip:hover:not(.active){border-color:var(--border2);background:rgba(88,166,255,.12);color:var(--text);transform:translateY(-1px)}
.dataset-chip.active{
  background:linear-gradient(90deg, rgba(88,166,255,.25), rgba(163,113,247,.25));
  border-color:var(--border2);color:#fff;
  box-shadow:0 0 18px rgba(88,166,255,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
.dataset-chip.loading{opacity:.5;cursor:wait}
.dataset-hint{
  font-size:11px;color:var(--muted);font-style:italic;
  margin-left:auto;white-space:nowrap;
}

/* ── 1.5 Barra de estado ────────────────────────────────────── */
.status-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 14px;margin-bottom:14px;
  background:rgba(10,16,26,.55);
  border:1px solid var(--border);border-radius:12px;
  font-size:12px;color:var(--muted);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.status-bar .src{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.status-bar .src b{color:var(--text);font-weight:700}
.status-bar .pill{
  padding:2px 9px;border-radius:999px;
  background:rgba(88,166,255,.14);color:var(--accent);
  border:1px solid rgba(88,166,255,.35);
  font-size:11px;font-weight:700;letter-spacing:.04em;
}
.status-bar .pill.warn{background:rgba(227,179,65,.14);color:var(--gold);border-color:rgba(227,179,65,.4)}
.status-bar .pill.filter{background:rgba(63,185,80,.14);color:var(--good);border-color:rgba(63,185,80,.45);display:none}
.status-bar .pill.filter.show{display:inline-block}
.status-bar .actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.mini-btn{
  padding:6px 12px;border-radius:9px;cursor:pointer;font-size:11.5px;font-weight:700;
  background:rgba(88,166,255,.10);border:1px solid var(--border2);color:var(--accent);
  transition:.16s;letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px;
}
.mini-btn:hover{background:rgba(88,166,255,.22);transform:translateY(-1px)}

/* ── 1.6 Layout principal ───────────────────────────────────── */
main{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media(max-width:940px){main{grid-template-columns:1fr}.hud{grid-template-columns:1fr 1fr}.hud-item.main{grid-column:1 / -1}}

/* ── 1.7 Arena (problema y respuestas) ──────────────────────── */
.arena{
  background:linear-gradient(180deg, rgba(28,36,50,.72), rgba(20,26,36,.72));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:20px;padding:22px 24px 24px;
  box-shadow:0 18px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
  position:relative;overflow:hidden;
}
.arena::before{
  content:'';position:absolute;inset:0;border-radius:20px;
  background:radial-gradient(600px 220px at 15% 0%, rgba(88,166,255,.10), transparent 70%);
  pointer-events:none;
}
.arena > *{position:relative}

.rival-bar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:11px 16px;border-radius:14px;
  background:linear-gradient(90deg, rgba(88,166,255,.10), rgba(163,113,247,.07));
  border:1px solid var(--border);margin-bottom:20px;font-size:13px;color:var(--muted);
}
.rival-bar strong{color:var(--text);font-size:19px;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(88,166,255,.35)}
.tier{
  font-size:10.5px;padding:3px 10px;border-radius:999px;
  border:1px solid var(--border2);background:rgba(10,16,26,.6);color:var(--accent);
  text-transform:uppercase;letter-spacing:.1em;font-weight:700;
}
.tier.elite{color:var(--gold);border-color:rgba(227,179,65,.55);box-shadow:0 0 14px rgba(227,179,65,.2)}
.vs{margin-left:auto;font-style:italic;font-size:12px;color:var(--muted)}

.tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:700}
.tag .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle;box-shadow:0 0 10px currentColor}

.q{
  font-size:22px;line-height:1.7;margin-bottom:24px;
  font-family:'Cambria','Georgia','Times New Roman',serif;
  letter-spacing:.005em;overflow-x:auto;overflow-y:hidden;
}

/* ── 1.8 Opciones de respuesta ──────────────────────────────── */
.options{display:grid;gap:10px}
.opt{
  display:flex;align-items:center;gap:13px;text-align:left;
  background:rgba(28,36,50,.7);border:1px solid var(--border);color:var(--text);
  padding:14px 17px;border-radius:13px;font-size:15.5px;cursor:pointer;
  transition:.18s ease;font-family:'Cambria','Georgia',serif;position:relative;overflow:hidden;
  min-height:52px;
}
.opt:hover:not(:disabled){border-color:var(--border2);background:rgba(35,46,64,.9);transform:translateX(4px);box-shadow:0 6px 22px rgba(0,0,0,.35)}
.opt:disabled{cursor:default}
.opt .letter{
  flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:rgba(10,16,26,.7);border:1px solid var(--border);
  font-size:12px;font-weight:800;color:var(--muted);font-family:'Segoe UI',sans-serif;transition:.18s;
}
.opt .txt{flex:1;overflow-x:auto;overflow-y:hidden}
.opt.correct{border-color:var(--good);background:linear-gradient(90deg, rgba(63,185,80,.20), rgba(63,185,80,.08));box-shadow:0 0 22px rgba(63,185,80,.15)}
.opt.correct .letter{background:var(--good);color:#03170a;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:linear-gradient(90deg, rgba(248,81,73,.20), rgba(248,81,73,.08));box-shadow:0 0 22px rgba(248,81,73,.15)}
.opt.wrong .letter{background:var(--bad);color:#1a0303;border-color:var(--bad)}
.opt.dim{opacity:.42}

/* ── 1.9 Feedback y teoría ──────────────────────────────────── */
.feedback{
  margin-top:20px;font-size:14px;line-height:1.65;border-radius:14px;padding:0;
  max-height:0;overflow:hidden;transition:max-height .45s ease, padding .45s ease;
  border:1px solid transparent;
}
.feedback.show{max-height:1400px;padding:16px 18px}
.feedback.win{background:linear-gradient(180deg, rgba(63,185,80,.12), rgba(63,185,80,.05));border-color:rgba(63,185,80,.4)}
.feedback.lose{background:linear-gradient(180deg, rgba(248,81,73,.12), rgba(248,81,73,.05));border-color:rgba(248,81,73,.4)}
.feedback .title{font-weight:800;margin-bottom:8px;font-size:15.5px}
.feedback.win .title{color:var(--good)}
.feedback.lose .title{color:var(--bad)}
.feedback .sol{color:#b8c4d4}

.teoria{
  margin-top:14px;padding:13px 15px;border-radius:11px;
  background:rgba(88,166,255,.07);border-left:3px solid var(--accent);
  font-size:13.5px;line-height:1.7;color:#cdd9e8;
}
.teoria-title{font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.teoria-body strong{color:#e9eff7;font-weight:700}

.feedback .elo-line{
  margin-top:14px;font-size:12.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:14px;align-items:center;
}
.feedback .elo-line b.up{color:var(--good)}
.feedback .elo-line b.down{color:var(--bad)}
.tema-chip{
  padding:3px 10px;border-radius:999px;font-weight:700;font-size:11px;letter-spacing:.05em;
  border:1px solid var(--border2);background:rgba(88,166,255,.10);color:var(--accent);
}

.next{
  margin-top:18px;width:100%;padding:15px;border-radius:13px;border:none;
  background:linear-gradient(90deg,#58a6ff,#a371f7);color:#05121f;
  font-weight:800;font-size:15px;letter-spacing:.04em;cursor:pointer;transition:.2s;
  box-shadow:0 12px 30px rgba(88,166,255,.28);
}
.next:hover{filter:brightness(1.12);transform:translateY(-2px)}

/* ── 1.10 Panel de perfil (radar + leyenda) ─────────────────── */
.perfil{
  background:linear-gradient(180deg, rgba(28,36,50,.72), rgba(20,26,36,.72));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:20px;padding:20px 18px 18px;
  box-shadow:0 18px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
  position:sticky;top:18px;
}
.perfil h2{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.perfil .sub{font-size:12px;color:var(--muted);margin-bottom:14px;min-height:16px;transition:.18s}
.perfil .sub b{color:var(--accent);font-weight:700}
.perfil .sub.filter-active b{color:var(--good)}
.radar-wrap{position:relative;display:flex;justify-content:center;margin-bottom:16px}
#radar{width:100%;max-width:330px;display:block}
.legend{display:flex;flex-direction:column;gap:7px}
.lg-item{
  display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;
  padding:7px 10px;border-radius:9px;background:rgba(10,16,26,.4);
  border:1px solid transparent;font-size:12.5px;transition:.18s;
  cursor:pointer;user-select:none;
}
.lg-item:hover{border-color:rgba(120,170,255,.35);background:rgba(88,166,255,.06)}
.lg-item.hi{border-color:rgba(163,113,247,.5);background:rgba(163,113,247,.10)}
.lg-item.active{border-color:rgba(63,185,80,.6);background:rgba(63,185,80,.12);box-shadow:0 0 14px rgba(63,185,80,.15)}
.lg-item.active .lg-name{color:#8fdf9c;font-weight:700}
.lg-item.active .lg-val{color:#a8f0b3}
.lg-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 10px currentColor;background:currentColor}
.lg-name{color:#c9d5e6;transition:.15s}
.lg-val{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
.lg-val small{font-weight:600;font-size:10.5px;color:var(--muted);margin-left:4px}
.lg-check{display:none;font-size:11px;color:var(--good);font-weight:800}
.lg-item.active .lg-check{display:inline}

/* ── 1.11 Loader y modal de archivo ─────────────────────────── */
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:14px;color:var(--muted)}
.spinner{width:38px;height:38px;border-radius:50%;border:3px solid rgba(88,166,255,.2);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.modal-backdrop{
  position:fixed;inset:0;z-index:900;background:rgba(5,7,15,.72);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{
  width:100%;max-width:520px;
  background:linear-gradient(180deg, rgba(28,36,50,.96), rgba(20,26,36,.96));
  border:1px solid var(--border2);border-radius:22px;
  padding:26px 26px 22px;
  box-shadow:0 30px 90px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.06);
  transform:translateY(14px) scale(.97);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);
  position:relative;
}
.modal-backdrop.open .modal{transform:translateY(0) scale(1)}
.modal h2{font-size:17px;font-weight:800;letter-spacing:.02em;margin-bottom:4px;color:var(--text)}
.modal .modal-sub{font-size:12.5px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.modal-close{
  position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:9px;
  background:transparent;border:1px solid var(--border);color:var(--muted);
  cursor:pointer;display:grid;place-items:center;font-size:14px;line-height:1;transition:.16s;
}
.modal-close:hover{color:var(--bad);border-color:var(--bad);background:rgba(248,81,73,.10)}
.op-list{display:flex;flex-direction:column;gap:9px}
.op-card{
  display:flex;align-items:flex-start;gap:14px;padding:14px 15px;
  background:rgba(10,16,26,.5);border:1px solid var(--border);border-radius:13px;
  cursor:pointer;transition:.16s;text-align:left;color:var(--text);font-family:inherit;width:100%;
}
.op-card:hover:not(:disabled){border-color:var(--border2);background:rgba(88,166,255,.08);transform:translateX(3px)}
.op-card:disabled{opacity:.5;cursor:not-allowed}
.op-card .ic{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.22)}
.op-card.danger .ic{background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.30)}
.op-card .body{flex:1;min-width:0}
.op-card .t{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:2px}
.op-card .d{font-size:11.5px;color:var(--muted);line-height:1.45}
.op-card input[type=file]{display:none}
.modal-footer{
  margin-top:18px;padding-top:14px;border-top:1px solid var(--border);
  font-size:11px;color:var(--muted);line-height:1.55;
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
</style>
</head>
<body>
<div class="bg"></div>

<!-- ═══════════════════════════════════════════════════════════════
     SECCIÓN 2 · ESTRUCTURA HTML
     ═══════════════════════════════════════════════════════════════ -->

<!-- ── 2.1 Contenedor principal de la app (render dinámico) ──── -->
<div class="app" id="app">
  <div class="loading">
    <div class="spinner"></div>
    <div>Cargando dataset…</div>
  </div>
</div>

<!-- ── 2.2 Modal de archivo (descargar / cargar / reiniciar) ──── -->
<div class="modal-backdrop" id="fileModal">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Archivo">
    <button class="modal-close" id="modalClose" title="Cerrar">✕</button>
    <h2>📁 Archivo</h2>
    <div class="modal-sub">
      Tu progreso se guarda automáticamente en este navegador. Acá podés hacer copias de seguridad o restaurarlas.
    </div>

    <div class="op-list">
      <button class="op-card" id="opDownload">
        <div class="ic">⬇</div>
        <div class="body">
          <div class="t">Descargar progreso</div>
          <div class="d">Baja un <code>math.json</code> con tu ELO actual y el de todos los problemas.</div>
        </div>
      </button>
      <button class="op-card" id="opPush">
        <div class="ic">⬆</div>
        <div class="body">
          <div class="t">Enviar ELOs al gist</div>
          <div class="d">Sube los ELOs actuales de los problemas a GitHub. Los usuarios nuevos arrancarán con esta dificultad calibrada.</div>
        </div>
      </button>
      <label class="op-card" for="opUploadInput">
        <div class="ic">⬆</div>
        <div class="body">
          <div class="t">Cargar progreso desde archivo</div>
          <div class="d">Reemplaza tu progreso actual con el de un <code>math.json</code> que hayas descargado antes.</div>
        </div>
        <input type="file" id="opUploadInput" accept=".json,application/json">
      </label>
      <button class="op-card danger" id="opReset">
        <div class="ic">↺</div>
        <div class="body">
          <div class="t">Reiniciar progreso</div>
          <div class="d">Vuelve a los ELOs iniciales. Los problemas se mantienen.</div>
        </div>

    </div>

    <div class="modal-footer">
      <span id="modalSavedInfo">—</span>
      <span>💾 Autoguardado local activo</span>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 3 · CONFIGURACIÓN
   ═══════════════════════════════════════════════════════════════
   ┌──────────────────────────────────────────────────────────────┐
   │  👉 Poné acá el ID de tu gist.                               │
   │  Ejemplo: si tu gist es                                     │
   │     https://gist.github.com/tu-usuario/a1b2c3d4e5f6a7b8c9   │
   │  entonces GIST_ID = "a1b2c3d4e5f6a7b8c9".                   │
   │                                                              │
   │  Si lo dejás vacío (""), la app usa REMOTE_URL o el dataset  │
   │  por defecto (comportamiento viejo).                         │
   └──────────────────────────────────────────────────────────────┘ */

const GIST_ID = "5367c035bcf515d11a9c1b14f60563dd";   // ← COMPLETAR CON TU GIST ID https://gist.github.com/jmtenti/5367c035bcf515d11a9c1b14f60563dd

/* URL del Worker de Cloudflare que hace de puente con la API de GitHub. */
const WORKER_URL = "https://dry-dawn-b655.jmtenti.workers.dev";
	
/* Fallback: solo se usa si GIST_ID está vacío. */
let REMOTE_URL = "https://gist.githubusercontent.com/..../raw/math.json";

/* Si GIST_ID está puesto, la URL se completa sola. */
const GIST_API_URL = GIST_ID ? ("https://api.github.com/gists/" + GIST_ID) : null;

const AUTOSAVE_MS = 20000;
const EXPORT_FILENAME = 'dataset.json';

/* Cuántos IDs recientes recordar para el anti-repetición. */
const RECENT_HISTORY_MAX = 40;

const DEFAULT_COLORS = [
  '#58a6ff','#a371f7','#3fb950','#e3b341','#ff7b72','#79c0ff',
  '#d2a8ff','#7ee787','#ffa657','#ff9bce'
];

/* fetch con timeout: si la red se cuelga, cortamos a los 8s.
   Devuelve la Response, o lanza AbortError si se pasa del tiempo. */
async function fetchWithTimeout(url, opts = {}, ms = 8000){
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), ms);
  try{
    return await fetch(url, { ...opts, signal: ctrl.signal });
  } finally {
    clearTimeout(to);
  }
}

/* ── Ajuste de convergencia tema ↔ global ─────────────────────── */
/* Si el ELO de un tema se aleja mucho del global, queremos que se
   acerque más rápido. Dos mecanismos: boost del K y término extra. */
const CONV_UMBRAL   = 100;   /* brecha mínima para activar la convergencia */
const CONV_FACTOR   = 0.05;  /* fracción del exceso que se cierra por ronda */
const K_BOOST_RANGO = 400;   /* brecha que duplica el K */
const K_BOOST_MAX   = 2;     /* multiplicador máximo del boost (K hasta 3x) */

/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 4 · META DEL DATASET
   ═══════════════════════════════════════════════════════════════ */

const DEFAULT_META = {
  titulo: 'Duelo ELO',
  subtitulo: '',
  eloMin: 800,
  eloMax: 1800,
  eloStart: null,
  eloStartPct: 0.2,
  nRings: 5,
  kUser: 32,
  kProb: 16,
  id: null
};

let META = { ...DEFAULT_META };

function buildMeta(s){
  const m = (s && s.meta) || {};
  META = { ...DEFAULT_META };

  META.titulo = (typeof m.titulo === 'string' && m.titulo) ? m.titulo : DEFAULT_META.titulo;
  META.subtitulo = (typeof m.subtitulo === 'string') ? m.subtitulo : '';
  META.eloMin = Number(m.eloMin) || DEFAULT_META.eloMin;
  META.eloMax = Number(m.eloMax) || DEFAULT_META.eloMax;
  META.nRings = Math.max(2, Math.round(Number(m.nRings) || DEFAULT_META.nRings));
  META.kUser = Number(m.kUser) || DEFAULT_META.kUser;
  META.kProb = Number(m.kProb) || DEFAULT_META.kProb;

  const pct = (typeof m.eloStartPct === 'number' && m.eloStartPct >= 0 && m.eloStartPct <= 1)
    ? m.eloStartPct
    : DEFAULT_META.eloStartPct;
  META.eloStart = (typeof m.eloStart === 'number' && isFinite(m.eloStart))
    ? m.eloStart
    : Math.round(META.eloMin + pct * (META.eloMax - META.eloMin));

  META.id = (typeof m.id === 'string' && m.id) ? m.id : null;
  document.title = META.titulo;
}


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 5 · CLAVE DE LOCALSTORAGE (una por dataset)
   ═══════════════════════════════════════════════════════════════ */

const LS_BASE = 'duelo_elo_v1';
const SELECTED_DATASET_KEY = LS_BASE + '::selected-dataset';

let LS_KEY = LS_BASE + '::default';

/* Necesitamos saber qué archivo del gist está seleccionado para
   que cada dataset tenga su propio progreso. */
let selectedFilename = null;

function computeLsKey(){
  /* Prioridad 1: gist + archivo seleccionado */
  if(GIST_ID && selectedFilename){
    return LS_BASE + '::gist-' + GIST_ID + '::' + selectedFilename;
  }
  /* Prioridad 2: id del dataset */
  if(META.id) return LS_BASE + '::' + META.id;
  /* Prioridad 3: hash de REMOTE_URL */
  if(REMOTE_URL && !REMOTE_URL.includes('TU_GIST_ID')){
    let h = 0;
    for(let i = 0; i < REMOTE_URL.length; i++){ h = (h * 31 + REMOTE_URL.charCodeAt(i)) | 0; }
    return LS_BASE + '::url-' + Math.abs(h).toString(36);
  }
  return LS_BASE + '::default';
}


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 6 · TEMAS Y COLORES
   ═══════════════════════════════════════════════════════════════ */

let temasConfig = [];
let useExplicitTemas = false;

function buildTemasConfig(s){
  const result = [];
  const seen = new Set();
  const hasExplicit = Array.isArray(s.temas) && s.temas.length > 0;
  useExplicitTemas = hasExplicit;

  if(hasExplicit){
    s.temas.forEach((t, i) => {
      const nombre = typeof t === 'string' ? t : (t && t.nombre);
      if(!nombre || seen.has(nombre)) return;
      seen.add(nombre);
      const color = (typeof t === 'object' && t && t.color)
        ? t.color
        : DEFAULT_COLORS[i % DEFAULT_COLORS.length];
      result.push({ nombre, color });
    });
    for(const p of s.problemas || []){
      const nombre = p.tema;
      if(!nombre || seen.has(nombre)) continue;
      seen.add(nombre);
      result.push({
        nombre,
        color: DEFAULT_COLORS[result.length % DEFAULT_COLORS.length]
      });
    }
  } else {
    const unique = new Set();
    for(const p of s.problemas || []){
      if(p.tema) unique.add(p.tema);
    }
    [...unique].forEach((nombre, i) => {
      result.push({ nombre, color: DEFAULT_COLORS[i % DEFAULT_COLORS.length] });
    });
  }
  return result;
}

function temaDe(p){
  if(useExplicitTemas){
    const nombre = p.tema || '';
    const exact = temasConfig.find(c => c.nombre === nombre);
    if(exact) return exact.nombre;
    const lower = nombre.toLowerCase();
    const fuzzy = temasConfig.find(c => lower.includes(c.nombre.toLowerCase()));
    if(fuzzy) return fuzzy.nombre;
    return temasConfig[0]?.nombre || 'General';
  }
  return p.tema || temasConfig[0]?.nombre || 'General';
}

function colorDe(tema){
  const t = temasConfig.find(c => c.nombre === tema);
  return t ? t.color : DEFAULT_COLORS[0];
}

/* Garantiza ELOs por tema y ELO global. */
function ensureTemaElos(){
  if(!state.usuario.temaElo) state.usuario.temaElo = {};
  const validos = new Set(temasConfig.map(t => t.nombre));
  for(const k of Object.keys(state.usuario.temaElo)){
    if(!validos.has(k)) delete state.usuario.temaElo[k];
  }
  for(const t of temasConfig){
    if(typeof state.usuario.temaElo[t.nombre] !== 'number'){
      state.usuario.temaElo[t.nombre] = META.eloStart;
    }
  }

  /* ELO global: migración desde el modelo viejo (promedio). */
  if(typeof state.usuario.eloGlobal !== 'number' || !isFinite(state.usuario.eloGlobal)){
    const elos = temasConfig
      .map(t => state.usuario.temaElo[t.nombre])
      .filter(v => typeof v === 'number' && isFinite(v));
    state.usuario.eloGlobal = elos.length
      ? elos.reduce((a, b) => a + b, 0) / elos.length
      : META.eloStart;
  }
}


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 7 · MATHJAX (typeset diferido con reintentos)
   ═══════════════════════════════════════════════════════════════ */

let mjRetries = 0;
function typesetMath(el){
  if(!el) return;
  if(window.MathJax && window.MathJax.typesetPromise){
    window.MathJax.typesetPromise([el]).catch(()=>{});
    return;
  }
  if(mjRetries++ < 40) setTimeout(() => typesetMath(el), 250);
}


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 8 · ESTADO GLOBAL DE LA APP
   ═══════════════════════════════════════════════════════════════ */

let state = null;
let current = null;
let answered = false;
let dataSource = 'defaults';
let temaForzado = null;

function createDefaultState(){
  const temaElo = {};
  temasConfig.forEach(t => temaElo[t.nombre] = META.eloStart);
  return {
    version: 1, savedAt: null, datasetId: META.id || null,
    usuario: {
      temaElo,
      eloGlobal: META.eloStart,
      wins:0, losses:0, streak:0, best:0, round:0, recent:[]
    },
    problemas: []
  };
}

function validateState(s){
  if(!s || typeof s !== 'object') return false;
  if(!Array.isArray(s.problemas) || s.problemas.length === 0) return false;
  if(!s.usuario || typeof s.usuario !== 'object') return false;
  if(typeof s.usuario.temaElo !== 'object') return false;
  for(const p of s.problemas){
    if(typeof p.id !== 'number' || typeof p.elo !== 'number') return false;
    if(!Array.isArray(p.opts) || typeof p.a !== 'number') return false;
    if(typeof p.q !== 'string' || typeof p.tema !== 'string') return false;
  }
  return true;
}


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 9 · CARGA DEL DATASET
   ═══════════════════════════════════════════════════════════════ */

async function loadState(){
  const local = readLocalStorage();
  const remote = await fetchRemote();

  if(local){
    dataSource = remote ? 'remote+local' : 'localStorage';
    if(remote){
      const idsLocal = new Set(local.problemas.map(p => p.id));
      const nuevos = remote.problemas.filter(p => !idsLocal.has(p.id));
      if(nuevos.length) local.problemas = local.problemas.concat(nuevos);
      if(remote.temas) local.temas = remote.temas;
      if(remote.meta) local.meta = remote.meta;
    }
    return local;
  }

  if(remote){
    dataSource = 'remote';
    saveLocalStorage(remote);
    return remote;
  }

  dataSource = 'defaults';
  return createDefaultState();
}

function readLocalStorage(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!validateState(data)) return null;
    return data;
  }catch(e){ return null; }
}

async function fetchRemote(){
  if(!REMOTE_URL || REMOTE_URL.includes('TU_GIST_ID')) return null;
  try{
    const sep = REMOTE_URL.includes('?') ? '&' : '?';
    const resp = await fetch(REMOTE_URL + sep + '_=' + Date.now(), {cache:'no-store'});
    if(!resp.ok){ console.warn('Fuente remota respondió', resp.status); return null; }
    const data = JSON.parse(await resp.text());
    if(validateState(data)){ console.log('✓ Dataset cargado desde', REMOTE_URL); return data; }
    console.warn('Dataset remoto inválido');
  }catch(e){ console.warn('Falló fetch remoto:', e.message); }
  return null;
}


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 9.5 · DESCUBRIMIENTO DE DATASETS EN EL GIST
   ═══════════════════════════════════════════════════════════════ */

let gistFiles = [];   /* [{ filename, nombre, url, size }] */

async function listGistFiles(){
  if(!GIST_API_URL) return [];
  try{
    const resp = await fetch(GIST_API_URL, {
      headers: { 'Accept': 'application/vnd.github+json' }
    });
    if(!resp.ok){
      console.warn('Gist API respondió', resp.status);
      return [];
    }
    const data = await resp.json();
    const files = Object.values(data.files || {});
    return files
      .filter(f => /\.json$/i.test(f.filename))
      .map(f => ({
        filename: f.filename,
        nombre: prettyName(f.filename),
        url: f.raw_url,
        size: f.size
      }));
  }catch(e){
    console.warn('Error listando gist:', e);
    return [];
  }
}

function prettyName(filename){
  /* "fisica_estadistica.json"   → "Fisica Estadistica"
     "física_estadística.json"   → "Física Estadística"
     "límites_al_infinito.json"  → "Límites Al Infinito" */
  return filename
    .replace(/\.json$/i, '')
    .replace(/[_-]+/g, ' ')
    .replace(/(^|\s)(\p{L})/gu, (_, sep, c) => sep + c.toUpperCase());
}

/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 10 · GUARDADO, EXPORTACIÓN E IMPORTACIÓN
   ═══════════════════════════════════════════════════════════════ */

function saveLocalStorage(s = state){
  try{
    s.savedAt = new Date().toISOString();
    s.datasetId = META.id || null;
    localStorage.setItem(LS_KEY, JSON.stringify(s));
  }catch(e){ console.warn('No se pudo guardar', e); }
}

function exportProgress(){
  state.savedAt = new Date().toISOString();
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = EXPORT_FILENAME;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  saveLocalStorage();
  updateSaveIndicator();
  updateModalSavedInfo();
  showToast('💾 ' + EXPORT_FILENAME + ' descargado');
}

function importProgress(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = JSON.parse(e.target.result);
      if(!validateState(data)) throw new Error('El archivo no tiene la estructura esperada');

      state = data;
      buildMeta(state);
      LS_KEY = computeLsKey();
      temasConfig = buildTemasConfig(state);
      ensureTemaElos();

      saveLocalStorage();
      lastSavedAt = new Date();
      dataSource = 'localStorage';
      temaForzado = null;
      updateSaveIndicator();
      closeModal();
      buildUI();
      showToast('📥 Progreso cargado desde archivo');
    }catch(err){
      alert('No se pudo importar: ' + err.message);
    }
  };
  reader.readAsText(file);
}

/* Sube los ELOs actuales de los problemas al gist de GitHub
   a través del Worker de Cloudflare.
   `silent = true` evita los toasts "Enviando…" cuando corre en automático. */
async function pushProgressToGist(silent = false){
  if(!selectedFilename){
    if(!silent) showToast('No hay un dataset seleccionado', true);
    return false;
  }
  if(!WORKER_URL || WORKER_URL.includes('TU-USUARIO')){
    if(!silent) showToast('Configurá WORKER_URL primero', true);
    return false;
  }

  if(!silent) showToast('⬆ Enviando ELOs al gist…');

  try{
    const dataToSync = {
      problemas: state.problemas
    };

    const response = await fetch(WORKER_URL + '/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        gistId: GIST_ID,
        filename: selectedFilename,
        content: JSON.stringify(dataToSync, null, 2)
      })
    });

    const result = await response.json();

    if(!response.ok){
      throw new Error(result.error || 'Error en el Worker');
    }

    if(!silent) showToast('✅ ELOs sincronizados con el gist');
    console.log('Gist actualizado:', result.url);
    return true;

  }catch(error){
    console.error('Error al sincronizar:', error);
    showToast('❌ Error al sincronizar: ' + error.message, true);
    return false;
  }
}

/* ── Autosync de ELOs al gist ──────────────────────────────────
   Cada 2 minutos chequea si hubo respuestas nuevas sin sincronizar.
   Si las hay, sube. Si no, no hace nada.
   ──────────────────────────────────────────────────────────── */

const SYNC_INTERVAL_MS = 2 * 60 * 1000;   /* cada 2 minutos */

let respuestasSinSync = 0;
let syncEnCurso = false;

async function maybeAutoSync(){
  if(syncEnCurso) return;                    /* ya hay un sync corriendo */
  if(respuestasSinSync === 0) return;        /* nada nuevo que subir */
  if(!selectedFilename) return;              /* dataset aún no cargado */

  syncEnCurso = true;
  const ok = await pushProgressToGist(true); /* silencioso */
  syncEnCurso = false;

  if(ok) respuestasSinSync = 0;
  /* Si falló, dejamos el contador como está para reintentar en 2 min */
}

setInterval(maybeAutoSync, SYNC_INTERVAL_MS);	
	


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 11 · AUTOSAVE
   ═══════════════════════════════════════════════════════════════ */

let dirty = false;
let lastSavedAt = null;

function tickAutosave(force = false){
  if(!dirty && !force) return;
  dirty = false;
  saveLocalStorage();
  lastSavedAt = new Date();
  updateSaveIndicator();
  updateModalSavedInfo();
}

function updateSaveIndicator(){
  const el = document.getElementById('saveIndicator');
  if(!el) return;
  if(!lastSavedAt){
    el.textContent = '• sin cambios aún';
    el.style.color = 'var(--muted)';
    return;
  }
  const seg = Math.floor((Date.now() - lastSavedAt.getTime()) / 1000);
  const txt = seg < 5    ? 'guardado ahora'
            : seg < 60   ? 'guardado hace ' + seg + ' s'
            : seg < 3600 ? 'guardado hace ' + Math.floor(seg/60) + ' min'
            : 'guardado hace ' + Math.floor(seg/3600) + ' h';
  el.textContent = '✓ ' + txt;
  el.style.color = 'var(--good)';
}

function updateModalSavedInfo(){
  const el = document.getElementById('modalSavedInfo');
  if(!el) return;
  if(!lastSavedAt){ el.textContent = 'Última vez: nunca'; return; }
  const fecha = lastSavedAt.toLocaleString('es-AR', {
    day:'2-digit', month:'2-digit', year:'numeric',
    hour:'2-digit', minute:'2-digit'
  });
  el.textContent = 'Última vez: ' + fecha;
}

setInterval(() => tickAutosave(), AUTOSAVE_MS);
setInterval(() => { updateSaveIndicator(); updateModalSavedInfo(); }, 5000);

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden') tickAutosave();
});
window.addEventListener('beforeunload', () => tickAutosave(true));


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 12 · MODAL DE ARCHIVO
   ═══════════════════════════════════════════════════════════════ */

function openModal(){ updateModalSavedInfo(); document.getElementById('fileModal').classList.add('open'); }
function closeModal(){ document.getElementById('fileModal').classList.remove('open'); }

document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('fileModal').addEventListener('click', (e) => { if(e.target.id === 'fileModal') closeModal(); });

document.getElementById('opDownload').addEventListener('click', () => { exportProgress(); closeModal(); });

document.getElementById('opPush').addEventListener('click', async () => {
  const ok = await pushProgressToGist(false);
  if(ok) respuestasSinSync = 0;
  closeModal();
});

document.getElementById('opUploadInput').addEventListener('change', (e) => {
  const f = e.target.files[0]; if(f) importProgress(f); e.target.value = '';
});

document.getElementById('opReset').addEventListener('click', () => {
  if(confirm('¿Reiniciar todo el progreso? Se borrarán tus ELOs y los de los problemas.\n\nTip: descargá una copia antes desde "Descargar progreso".')){
    const problemasReset = state.problemas.map(p => ({...p, elo: p.eloOriginal ?? p.elo}));
    const temasReset = state.temas;
    const metaReset = state.meta;
    state = createDefaultState();
    state.problemas = problemasReset;
    if(temasReset) state.temas = temasReset;
    if(metaReset) state.meta = metaReset;
    temasConfig = buildTemasConfig(state);
    ensureTemaElos();
    dataSource = 'defaults';
    temaForzado = null;
    saveLocalStorage();
    lastSavedAt = new Date();
    closeModal();
    buildUI();
    showToast('↺ Progreso reiniciado');
  }
});


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 13 · SELECTOR DE DATASETS (ARCHIVOS DEL GIST)
   ═══════════════════════════════════════════════════════════════ */

/* Cambia de dataset sin recargar la página. */
async function switchDataset(filename){
  if(filename === selectedFilename) return;
  if(!gistFiles.length) return;

  /* 1) Guardar progreso del dataset actual */
  tickAutosave(true);

  /* 2) Actualizar selección y persistirla */
  selectedFilename = filename;
  try{ localStorage.setItem(SELECTED_DATASET_KEY, filename); }catch(e){}

  /* 3) Apuntar REMOTE_URL al archivo elegido y recalcular LS_KEY */
  const file = gistFiles.find(f => f.filename === filename);
  if(!file) return;
  REMOTE_URL_OVERRIDE = file.url;   /* ver Sección 9 (fetchRemote) */
  REMOTE_URL = file.url;
  LS_KEY = computeLsKey();

  /* 4) Mostrar feedback visual */
  setDatasetBarLoading(true);

  /* 5) Cargar estado del nuevo dataset */
  try{
    state = await loadState();
    buildMeta(state);
    temasConfig = buildTemasConfig(state);
    ensureTemaElos();

    dirty = false;
    lastSavedAt = state.savedAt ? new Date(state.savedAt) : null;
    dataSource = (dataSource === 'remote' || dataSource === 'remote+local')
      ? dataSource
      : 'localStorage';
    temaForzado = null;

    buildUI();
    showToast('📚 ' + (META.titulo || file.nombre));
  }catch(e){
    console.warn('Error cambiando dataset:', e);
    showToast('No se pudo cargar el dataset', true);
  } finally {
    setDatasetBarLoading(false);
  }
}

function setDatasetBarLoading(on){
  const bar = document.getElementById('datasetBar');
  if(!bar) return;
  bar.querySelectorAll('.dataset-chip').forEach(b => {
    if(on) b.classList.add('loading');
    else b.classList.remove('loading');
  });
}

function renderDatasetBar(){
  const bar = document.getElementById('datasetBar');
  if(!bar) return;

  if(!GIST_ID || gistFiles.length === 0){
    bar.hidden = true;
    return;
  }

  bar.hidden = false;
  bar.innerHTML = '';

  const label = document.createElement('span');
  label.className = 'dataset-label';
  label.textContent = '📚 Tema';
  bar.appendChild(label);

  const chips = document.createElement('div');
  chips.className = 'dataset-chips';

  gistFiles.forEach(f => {
    const b = document.createElement('button');
    b.className = 'dataset-chip' + (f.filename === selectedFilename ? ' active' : '');
    b.textContent = f.nombre;
    b.title = f.filename;
    b.addEventListener('click', () => switchDataset(f.filename));

  const hint = document.createElement('span');
  hint.className = 'dataset-hint';
  hint.textContent = gistFiles.length + ' dataset' + (gistFiles.length === 1 ? '' : 's') + ' disponibles';
  bar.appendChild(hint);
}

/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 15 · HUD Y ELO GLOBAL
   ═══════════════════════════════════════════════════════════════ */

function eloGlobal(){
  return (typeof state.usuario.eloGlobal === 'number' && isFinite(state.usuario.eloGlobal))
    ? state.usuario.eloGlobal
    : META.eloStart;
}

function expected(u, p){ return 1 / (1 + Math.pow(10, (p - u) / 400)); }

function rangoNombre(elo){
  const pct = (elo - META.eloMin) / (META.eloMax - META.eloMin);
  if(pct < 0.25) return 'Principiante';
  if(pct < 0.50) return 'Intermedio';
  if(pct < 0.75) return 'Avanzado';
  if(pct < 0.90) return 'Difícil';
  return 'Élite';
}

function tier(elo){
  const pct = (elo - META.eloMin) / (META.eloMax - META.eloMin);
  if(pct < 0.25) return {name:'Principiante', cls:''};
  if(pct < 0.50) return {name:'Intermedio',   cls:''};
  if(pct < 0.75) return {name:'Avanzado',     cls:''};
  if(pct < 0.90) return {name:'Difícil',      cls:''};
  return {name:'Élite', cls:'elite'};
}

function nombreProblema(p){
  return 'P' + String(p.id).padStart(2,'0') + ' · ' + p.tema;
}

function updateHUD(){
  const g = eloGlobal();
  document.getElementById('userElo').textContent = Math.round(g);
  document.getElementById('rankLabel').textContent = 'Rango: ' + rangoNombre(g);
  document.getElementById('record').textContent = state.usuario.wins + ' – ' + state.usuario.losses;
  document.getElementById('streak').textContent = state.usuario.streak > 0 ? '🔥 ' + state.usuario.streak : '0';
  document.getElementById('round').textContent = state.usuario.round + 1;
}


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 16 · MATCHMAKING (anti-repetición con peso)
   ═══════════════════════════════════════════════════════════════ */

function pickProblem(){
  let base = state.problemas;
  if(temaForzado){
    base = base.filter(p => temaDe(p) === temaForzado);
  }
  if(base.length === 0) return state.problemas[0];

  const recent = state.usuario.recent || [];
  const recentSet = new Set(recent);
  const noVistos = base.filter(p => !recentSet.has(p.id));

  const umbralDuro = Math.min(
    base.length,
    Math.max(4, Math.floor(base.length * 0.3))
  );

  const pool = noVistos.length >= umbralDuro ? noVistos : base;

  const posReciente = new Map();
  recent.forEach((id, i) => posReciente.set(id, i));
  const N = Math.max(1, recent.length);

  const scored = pool.map(p => {
    /* El rival se elige siempre contra tu ELO global, no el del tema.
       Así, si filtrás por un tema, igual te da problemas de tu nivel. */
    const miElo = eloGlobal();
    const diffElo = Math.abs(p.elo - miElo);

    let repPenalty = 0;
    if(posReciente.has(p.id)){
      const pos = posReciente.get(p.id);
      repPenalty = 500 * (1 - pos / N);
    }

    return { p, score: diffElo + repPenalty };
  });

  scored.sort((a,b) => a.score - b.score);

  const candidatos = scored.slice(0, Math.min(4, scored.length));
  return candidatos[Math.floor(Math.random() * candidatos.length)].p;
}

function toggleTema(tema){
  if(temaForzado === tema){
    temaForzado = null;
    showToast('🎲 Modo aleatorio');
  } else {
    temaForzado = tema;
    showToast('🎯 Solo ' + tema);
  }
  updateFilterPill();
  renderRound();
}


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 17 · RONDA (render del problema actual)
   ═══════════════════════════════════════════════════════════════ */

function renderRound(){
  answered = false;
  current = pickProblem();
  const temaActual = temaDe(current);

  const pElo = current.elo;
  const t = tier(pElo);
  const dif = Math.round(pElo - eloGlobal());
  const signo = dif > 0 ? '+' : '';

  document.getElementById('rivalElo').textContent = Math.round(pElo);
  document.getElementById('rivalTier').textContent = t.name;
  document.getElementById('rivalTier').className = 'tier ' + t.cls;
  document.getElementById('matchInfo').textContent =
    (dif >= 0 ? 'Rival ' + signo + dif + ' ELO por encima' : 'Rival ' + Math.abs(dif) + ' ELO por debajo') +
    ' · tema ' + temaActual;

  const color = colorDe(temaActual);

  const pText = document.getElementById('problemText');
  pText.innerHTML =
    '<div class="tag"><span class="dot" style="color:' + color + '"></span>' +
    nombreProblema(current) + ' · Dificultad ' + Math.round(pElo) + '</div>' +
    '<div class="q">' + current.q + '</div>';

  const cont = document.getElementById('options');
  cont.innerHTML = '';
  current.opts.forEach((op, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="letter">' + 'ABCD'[i] + '</span><span class="txt">' + op + '</span>';
    b.addEventListener('click', () => responder(i));
    cont.appendChild(b);
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.innerHTML = '';

  document.getElementById('nextBtn').hidden = true;

  updateHUD();
  drawRadar(temaActual);
  renderLegend(temaActual);

  typesetMath(pText);
  typesetMath(cont);
}
/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 18 · RESPUESTA (actualización de ELOs y feedback)
   ═══════════════════════════════════════════════════════════════ */

function responder(indice){
  if(answered) return;
  answered = true;

  const temaActual = temaDe(current);
  const acierto = (indice === current.a);
  const pEloAntes = current.elo;
  const uTemaAntes = state.usuario.temaElo[temaActual] ?? META.eloStart;
  const S = acierto ? 1 : 0;

  /* ── 1) ELO GLOBAL: evoluciona como si no hubiera temas ───── */
  const gAntes  = eloGlobal();
  const E_g     = expected(gAntes, pEloAntes);
  const dGlobal = META.kUser * (S - E_g);
  state.usuario.eloGlobal = gAntes + dGlobal;
  /* ─────────────────────────────────────────────────────────── */

  /* ── 2) ELO DEL TEMA: con boost y convergencia hacia el global */
  const brecha    = gAntes - uTemaAntes;     /* >0 si el global está arriba */
  const absBrecha = Math.abs(brecha);

  /* Boost del K: cuanto más lejos está el tema del global, más rápido se mueve */
  const boost = 1 + Math.min(K_BOOST_MAX, absBrecha / K_BOOST_RANGO);
  const kTema = META.kUser * boost;

  /* Término de convergencia: cierra un % del exceso de brecha por ronda */
  let dConv = 0;
  if(absBrecha > CONV_UMBRAL){
    const exceso = absBrecha - CONV_UMBRAL;
    dConv = Math.sign(brecha) * CONV_FACTOR * exceso;
  }

  const E = expected(uTemaAntes, pEloAntes);
  const dUserBase = kTema * (S - E);
  const dUser = dUserBase + dConv;

  const uTemaDespues = uTemaAntes + dUser;
  state.usuario.temaElo[temaActual] = uTemaDespues;
  current.elo = pEloAntes + META.kProb * ((1 - S) - (1 - E));
  /* ─────────────────────────────────────────────────────────── */

  state.usuario.round += 1;
  if(acierto){
    state.usuario.wins++;
    state.usuario.streak++;
    state.usuario.best = Math.max(state.usuario.best, state.usuario.streak);
  }else{
    state.usuario.losses++;
    state.usuario.streak = 0;
  }

  if(!state.usuario.recent) state.usuario.recent = [];
  state.usuario.recent.unshift(current.id);
  const maxRecent = Math.min(
    RECENT_HISTORY_MAX,
    Math.max(8, Math.floor(state.problemas.length * 0.7))
  );
  if(state.usuario.recent.length > maxRecent){
    state.usuario.recent.length = maxRecent;
  }

  dirty = true;
  tickAutosave(true);
  respuestasSinSync++;
  const botones = [...document.querySelectorAll('.opt')];
  botones.forEach((b, i) => {
    b.disabled = true;
    if(i === current.a) b.classList.add('correct');
    else if(i === indice) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const fb = document.getElementById('feedback');
  const signoU = dUser >= 0 ? '+' : '';
  const signoP = (current.elo - pEloAntes) >= 0 ? '+' : '';
  fb.className = 'feedback show ' + (acierto ? 'win' : 'lose');

  const color = colorDe(temaActual);

  let html =
    '<div class="title">' +
      (acierto ? '✅ ¡Victoria! Le ganaste al problema.' : '❌ Derrota. El problema te ganó.') +
    '</div>' +
    '<div class="sol">' + current.sol + '</div>';

  if(!acierto && current.teoria){
    const t = (typeof current.teoria === 'string')
      ? { titulo: 'Teoría', texto: current.teoria }
      : current.teoria;
    html +=
      '<div class="teoria">' +
        '<div class="teoria-title">' + t.titulo + '</div>' +
        '<div class="teoria-body">' + t.texto + '</div>' +
      '</div>';
  }

  html +=
    '<div class="elo-line">' +
      '<span class="tema-chip" style="border-color:' + color + '55; color:' + color + '">' + temaActual + '</span>' +
      '<span>Tema: <b>' + Math.round(uTemaAntes) + '</b> → <b>' + Math.round(uTemaDespues) + '</b> ' +
      '(<b class="' + (dUser >= 0 ? 'up' : 'down') + '">' + signoU + dUser.toFixed(1) + '</b>)</span>' +
      '<span>Rival: ' + Math.round(pEloAntes) + ' → ' + Math.round(current.elo) +
      ' (<b class="' + ((current.elo - pEloAntes) >= 0 ? 'up' : 'down') + '">' + signoP + (current.elo - pEloAntes).toFixed(1) + '</b>)</span>' +
    '</div>';

  fb.innerHTML = html;
  typesetMath(fb);

  /* ── Delta al lado del ELO global ─────────────────────────── */
  const dEl = document.getElementById('userDelta');
  dEl.textContent = (dGlobal >= 0 ? '+' : '') + dGlobal.toFixed(0);
  dEl.className = 'delta show ' + (dGlobal >= 0 ? 'up' : 'down');
  clearTimeout(dEl.__to);
  dEl.__to = setTimeout(() => { dEl.className = 'delta'; }, 2500);
  /* ─────────────────────────────────────────────────────────── */

  updateHUD();
  drawRadar(temaActual);
  renderLegend(temaActual);
  document.getElementById('nextBtn').hidden = false;
  document.getElementById('nextBtn').focus();
}


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 19 · RANGO DINÁMICO DEL RADAR
   ═══════════════════════════════════════════════════════════════ */

function getRadarRange(){
  const elos = temasConfig
    .map(t => state.usuario.temaElo[t.nombre])
    .filter(v => typeof v === 'number' && isFinite(v));

  if(elos.length === 0){
    return { min: META.eloMin, max: META.eloMax };
  }

  const dataMin = Math.min(...elos);
  const dataMax = Math.max(...elos);
  const dataSpan = dataMax - dataMin;

  const margin = Math.max(30, dataSpan * 0.15);

  const rawMin = dataMin - margin;
  const rawMax = dataMax + margin;

  return {
    min: Math.floor(rawMin / 10) * 10,
    max: Math.ceil(rawMax / 10) * 10
  };
}

/* Corta un texto en varias líneas según el ancho disponible en el canvas. */
function wrapText(ctx, text, maxWidth){
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  for(const w of words){
    const test = cur ? cur + ' ' + w : w;
    if(ctx.measureText(test).width <= maxWidth || !cur){
      cur = test;
    } else {
      lines.push(cur);
      cur = w;
    }
  }
  if(cur) lines.push(cur);
  return lines.length ? lines : [String(text)];
}

/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 20 · DIBUJO DEL RADAR
   ═══════════════════════════════════════════════════════════════ */

function drawRadar(highlightTema = null){
  const canvas = document.getElementById('radar');
  if(!canvas) return;
  const size = canvas.clientWidth;
  if(!size) return;

  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  canvas.style.height = size + 'px';

  const ctx = canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, size, size);

  const n = temasConfig.length;
  if(n === 0) return;

  const cx = size/2, cy = size/2;
  const maxR = size * 0.28;
  const N = META.nRings;

  const range = getRadarRange();
  const rangeMin = range.min;
  const rangeMax = range.max;
  const rangeSpan = rangeMax - rangeMin;

  const angles = temasConfig.map((_, i) => -Math.PI/2 + i * 2*Math.PI / n);

  for(let ring = 1; ring <= N; ring++){
    const r = maxR * ring / N;
    ctx.beginPath();
    angles.forEach((a, i) => {
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.strokeStyle = 'rgba(120,170,255,' + (ring === N ? .30 : .10) + ')';
    ctx.lineWidth = ring === N ? 1.3 : 1;
    ctx.stroke();
  }

  angles.forEach((a, i) => {
    const isHi = highlightTema && temasConfig[i].nombre === highlightTema;
    const isForced = temaForzado && temasConfig[i].nombre === temaForzado;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * maxR, cy + Math.sin(a) * maxR);
    if(isForced) ctx.strokeStyle = 'rgba(63,185,80,.75)';
    else if(isHi) ctx.strokeStyle = temasConfig[i].color + 'cc';
    else ctx.strokeStyle = 'rgba(120,170,255,.13)';
    ctx.lineWidth = (isForced || isHi) ? 1.8 : 1;
    if(isForced || isHi) ctx.setLineDash([4,3]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  const pts = temasConfig.map((t, i) => {
    const elo = state.usuario.temaElo[t.nombre] ?? rangeMin;
    const norm = Math.max(0.02, Math.min(1, (elo - rangeMin) / rangeSpan));
    const r = maxR * norm;
    return { x: cx + Math.cos(angles[i]) * r, y: cy + Math.sin(angles[i]) * r, i };
  });

  ctx.beginPath();
  pts.forEach((p, i) => { if(i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.closePath();

  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
  grad.addColorStop(0,   'rgba(120,200,255,.45)');
  grad.addColorStop(0.6, 'rgba(140,140,255,.28)');
  grad.addColorStop(1,   'rgba(163,113,247,.15)');
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.strokeStyle = '#7cc4ff';
  ctx.lineWidth = 2.2;
  ctx.shadowColor = 'rgba(88,166,255,.6)';
  ctx.shadowBlur = 14;
  ctx.stroke();
  ctx.shadowBlur = 0;

  pts.forEach(p => {
    const color = temasConfig[p.i].color;
    const isForced = temaForzado && temasConfig[p.i].nombre === temaForzado;
    ctx.beginPath();
    ctx.arc(p.x, p.y, isForced ? 6.5 : 5, 0, 2*Math.PI);
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = isForced ? 18 : 12;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, isForced ? 6.5 : 5, 0, 2*Math.PI);
    ctx.strokeStyle = isForced ? '#8fdf9c' : '#fff';
    ctx.lineWidth = isForced ? 2 : 1.6;
    ctx.stroke();
  });

	/* ── Etiquetas de temas (con wrap y truncado) ─────────────── */
	ctx.font = '700 11px "Segoe UI", system-ui, sans-serif';
	ctx.textBaseline = 'middle';
	const LINE_H = 13;
	const LABEL_GAP = 16;

	temasConfig.forEach((t, i) => {
	  const a = angles[i];
	  const ca = Math.cos(a);
	  const lx = cx + Math.cos(a) * (maxR + LABEL_GAP);
	  const ly = cy + Math.sin(a) * (maxR + LABEL_GAP);

	  let align = 'center';
	  if(ca > 0.35) align = 'left';
	  else if(ca < -0.35) align = 'right';
	  ctx.textAlign = align;

	  /* Ancho disponible según dónde cae la etiqueta */
	  let maxW;
	  if(align === 'left')       maxW = size - lx - 4;
	  else if(align === 'right') maxW = lx - 4;
	  else                       maxW = 2 * Math.min(lx, size - lx) - 8;
	  if(maxW < 40) maxW = 40;   /* piso mínimo */

	  /* Envolver palabra por palabra */
	  let lines = wrapText(ctx, t.nombre, maxW);

	  /* Si una sola palabra no entra, truncar con "…" */
	  lines = lines.map(line => {
		if(ctx.measureText(line).width <= maxW) return line;
		let s = line;
		while(s.length > 1 && ctx.measureText(s + '…').width > maxW){
		  s = s.slice(0, -1);
		}
		return s + '…';
	  });

	  const isHi = highlightTema === t.nombre;
	  const isForced = temaForzado === t.nombre;
	  ctx.fillStyle = isForced ? '#8fdf9c'
				   : isHi     ? t.color
				   : 'rgba(233,239,247,.82)';

	  /* Dibujar las líneas centradas verticalmente alrededor de ly */
	  const totalH = lines.length * LINE_H;
	  const startY = ly - (totalH - LINE_H) / 2;
	  lines.forEach((line, li) => {
		ctx.fillText(line, lx, startY + li * LINE_H);
	  });
	});

  ctx.font = '700 10px "Segoe UI", system-ui, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';

  const txt = String(Math.round(rangeMax / 10) * 10);
  const w = ctx.measureText(txt).width;
  const labelX = cx;
  const labelY = cy - maxR;

  ctx.fillStyle = 'rgba(10,16,26,.90)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(labelX - w/2 - 7, labelY - 8, w + 14, 16, 5);
  else ctx.rect(labelX - w/2 - 7, labelY - 8, w + 14, 16);
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,170,255,.30)';
  ctx.lineWidth = 0.9;
  ctx.stroke();

  ctx.fillStyle = 'rgba(200,212,228,.95)';
  ctx.fillText(txt, labelX, labelY);
}


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 21 · LEYENDA POR TEMA
   ═══════════════════════════════════════════════════════════════ */

function renderLegend(highlightTema = null){
  const cont = document.getElementById('legend');
  if(!cont) return;
  cont.innerHTML = '';

  temasConfig.forEach(t => {
    const elo = state.usuario.temaElo[t.nombre] ?? META.eloStart;
    const diff = elo - META.eloStart;
    const signo = diff > 0 ? '+' : '';

    const div = document.createElement('div');
    let cls = 'lg-item';
    if(highlightTema === t.nombre) cls += ' hi';
    if(temaForzado === t.nombre) cls += ' active';
    div.className = cls;
    div.title = temaForzado === t.nombre
      ? 'Click para quitar el filtro y volver a aleatorio'
      : 'Click para practicar solo ' + t.nombre;

    div.innerHTML =
      '<span class="lg-dot" style="color:' + t.color + '"></span>' +
      '<span class="lg-name">' + t.nombre + '</span>' +
      '<span class="lg-val">' + Math.round(elo) +
        '<small>(' + signo + diff.toFixed(0) + ')</small>' +
        '<span class="lg-check">✓</span>' +
      '</span>';

    div.addEventListener('click', () => toggleTema(t.nombre));
    cont.appendChild(div);
  });

  const sub = document.getElementById('perfilSub');
  if(sub){
    if(temaForzado){
      sub.innerHTML = '🎯 Filtrando <b>' + temaForzado + '</b> · click para quitar';
      sub.classList.add('filter-active');
    } else {
      sub.innerHTML = 'Click en un tema para filtrar';
      sub.classList.remove('filter-active');
    }
  }
}


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 22 · TOAST (notificaciones efímeras)
   ═══════════════════════════════════════════════════════════════ */

function showToast(msg, isError = false){
  let t = document.getElementById('__toast');
  if(!t){ t = document.createElement('div'); t.id = '__toast'; document.body.appendChild(t); }
  t.style.cssText = `
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:rgba(20,26,36,.96);color:#e9eff7;padding:11px 20px;border-radius:12px;
    border:1px solid ${isError ? 'rgba(248,81,73,.55)' : 'rgba(88,166,255,.35)'};
    font-size:13px;z-index:1200;max-width:min(560px,90vw);text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.5);backdrop-filter:blur(12px);
    opacity:0;transition:.28s ease;pointer-events:none;font-weight:600;
  `;
  t.textContent = msg;
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t.__to);
  t.__to = setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(20px)';
  }, isError ? 4200 : 2600);
}


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 23 · EVENTOS GLOBALES (teclado y resize)
   ═══════════════════════════════════════════════════════════════ */

document.addEventListener('keydown', (e) => {
  if(document.getElementById('fileModal').classList.contains('open')) return;
  if(!answered && ['1','2','3','4'].includes(e.key)){
    const i = parseInt(e.key) - 1;
    const botones = [...document.querySelectorAll('.opt')];
    if(botones[i]) botones[i].click();
  }else if(answered && (e.key === 'Enter' || e.key === ' ')){
    e.preventDefault();
    const nb = document.getElementById('nextBtn');
    if(nb && !nb.hidden) nb.click();
  }
});

let resizeTO = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTO);
  resizeTO = setTimeout(() => {
    if(current) drawRadar(temaDe(current));
    else drawRadar();
  }, 100);
});


/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 24 · INICIALIZACIÓN
   ═══════════════════════════════════════════════════════════════ */

/* Variable auxiliar que usa fetchRemote (Sección 9) para leer la
   URL del archivo elegido en el gist. */
let REMOTE_URL_OVERRIDE = null;

(async function init(){
  /* ── 24.1 Listar los archivos del gist (si hay GIST_ID) ───── */
  if(GIST_ID){
    gistFiles = await listGistFiles();
    if(gistFiles.length > 0){
      /* ¿Cuál cargar? El guardado, o el primero. */
      let saved = null;
      try{ saved = localStorage.getItem(SELECTED_DATASET_KEY); }catch(e){}
      const found = gistFiles.find(f => f.filename === saved);
      selectedFilename = found ? found.filename : gistFiles[0].filename;
      const file = gistFiles.find(f => f.filename === selectedFilename);
      REMOTE_URL_OVERRIDE = file.url;
      REMOTE_URL = file.url;
    } else {
      console.warn('Gist sin archivos .json o API no disponible');
    }
  }

  /* ── 24.2 LS_KEY depende del archivo seleccionado ─────────── */
  LS_KEY = computeLsKey();

  /* ── 24.3 Cargar dataset (local + remoto) ─────────────────── */
  state = await loadState();

  buildMeta(state);
  temasConfig = buildTemasConfig(state);
  ensureTemaElos();

  if(state.usuario.recent && !Array.isArray(state.usuario.recent)){
    state.usuario.recent = [];
  }

  buildUI();
  lastSavedAt = state.savedAt ? new Date(state.savedAt) : null;
  updateSaveIndicator();
  updateModalSavedInfo();
})();

/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 25 · RECARGA MANUAL DEL DATASET
   ═══════════════════════════════════════════════════════════════ */

async function reloadDataset(){
  if(!selectedFilename && !REMOTE_URL){
    showToast('No hay dataset remoto configurado', true);
    return;
  }

  tickAutosave(true);
  const btn = document.getElementById('reloadBtn');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ Recargando…'; }

  try{
    /* 1) Traer el archivo fresco del gist */
    const url = REMOTE_URL;
    const sep = url.includes('?') ? '&' : '?';
    const resp = await fetchWithTimeout(url + sep + '_=' + Date.now(), {cache:'no-store'}, 10000);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const fresh = JSON.parse(await resp.text());
    if(!validateState(fresh)) throw new Error('El dataset remoto no es válido');

    /* 2) Guardar ELOs actuales por id para no perder progreso */
    const eloPorId = new Map();
    for(const p of state.problemas){
      eloPorId.set(p.id, p.elo);
    }

    /* 3) Reemplazar problemas; conservar elo si el id ya existía */
    const nuevos = fresh.problemas.map(p => ({
      ...p,
      elo: eloPorId.has(p.id) ? eloPorId.get(p.id) : p.elo
    }));

    /* 4) Actualizar el state conservando usuario y meta */
    state.problemas = nuevos;
    if(fresh.meta) state.meta = fresh.meta;
    if(fresh.temas) state.temas = fresh.temas;

    buildMeta(state);
    temasConfig = buildTemasConfig(state);
    ensureTemaElos();

    /* 5) Guardar y reconstruir UI */
    saveLocalStorage();
    lastSavedAt = new Date();
    buildUI();
    showToast('🔄 Dataset recargado · ' + nuevos.length + ' problemas');
  }catch(e){
    console.warn('Error recargando dataset:', e);
    showToast('No se pudo recargar: ' + (e.message || e), true);
  } finally {
    const b = document.getElementById('reloadBtn');
    if(b){ b.disabled = false; b.textContent = '🔄 Recargar'; }
  }
}

</script>
