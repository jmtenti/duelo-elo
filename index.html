async function fetchWithTimeout(url, opts = {}, ms = 8000){
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), ms);
  try{
    return await fetch(url, { ...opts, signal: ctrl.signal });
  } finally {
    clearTimeout(to);
  }
}

const DEFAULT_META = {
  titulo: 'Duelo ELO',
  subtitulo: '',
  eloMin: 200,
  eloMax: 2500,
  eloStart: null,
  eloStartPct: 0.2,
  nRings: 5,
  kUser: 32,
  kProb: 16,
  id: null
};

let META = { ...DEFAULT_META };

function buildMeta(s){
  const m = (s && s.meta) || {};
  META = { ...DEFAULT_META };

  META.titulo = (typeof m.titulo === 'string' && m.titulo) ? m.titulo : DEFAULT_META.titulo;
  META.subtitulo = (typeof m.subtitulo === 'string') ? m.subtitulo : '';
  META.eloMin = Number(m.eloMin) || DEFAULT_META.eloMin;
  META.eloMax = Number(m.eloMax) || DEFAULT_META.eloMax;
  META.nRings = Math.max(2, Math.round(Number(m.nRings) || DEFAULT_META.nRings));
  META.kUser = Number(m.kUser) || DEFAULT_META.kUser;
  META.kProb = Number(m.kProb) || DEFAULT_META.kProb;

  const pct = (typeof m.eloStartPct === 'number' && m.eloStartPct >= 0 && m.eloStartPct <= 1)
    ? m.eloStartPct : DEFAULT_META.eloStartPct;
  META.eloStart = (typeof m.eloStart === 'number' && isFinite(m.eloStart))
    ? m.eloStart
    : Math.round(META.eloMin + pct * (META.eloMax - META.eloMin));

  META.id = (typeof m.id === 'string' && m.id) ? m.id : null;
  document.title = META.titulo;
}

   ═══════════════════════════════════════════════════════════════ */

let temasConfig = [];
let useExplicitTemas = false;

function buildTemasConfig(s){
  const result = [];
  const seen = new Set();
  const hasExplicit = Array.isArray(s.temas) && s.temas.length > 0;
  useExplicitTemas = hasExplicit;

  if(hasExplicit){
    s.temas.forEach((t, i) => {
      const nombre = typeof t === 'string' ? t : (t && t.nombre);
      if(!nombre || seen.has(nombre)) return;
      seen.add(nombre);
      const color = (typeof t === 'object' && t && t.color)
        ? t.color : DEFAULT_COLORS[i % DEFAULT_COLORS.length];
      result.push({ nombre, color });
    });
    for(const p of s.problemas || []){
      const nombre = p.tema;
      if(!nombre || seen.has(nombre)) continue;
      seen.add(nombre);
      result.push({
        nombre,
        color: DEFAULT_COLORS[result.length % DEFAULT_COLORS.length]
      });
    }
  } else {
    const unique = new Set();
    for(const p of s.problemas || []){
      if(p.tema) unique.add(p.tema);
    }
    [...unique].forEach((nombre, i) => {
      result.push({ nombre, color: DEFAULT_COLORS[i % DEFAULT_COLORS.length] });
    });
  }
  return result;
}

function temaDe(p){
  if(useExplicitTemas){
    const nombre = p.tema || '';
    const exact = temasConfig.find(c => c.nombre === nombre);
    if(exact) return exact.nombre;
    const lower = nombre.toLowerCase();
    const fuzzy = temasConfig.find(c => lower.includes(c.nombre.toLowerCase()));
    if(fuzzy) return fuzzy.nombre;
    return temasConfig[0]?.nombre || 'General';
  }
  return p.tema || temasConfig[0]?.nombre || 'General';
}

function colorDe(tema){
  const t = temasConfig.find(c => c.nombre === tema);
  return t ? t.color : DEFAULT_COLORS[0];
}

function ensureTemaElos(){
  if(!state.usuario.temaElo) state.usuario.temaElo = {};
  const validos = new Set(temasConfig.map(t => t.nombre));
  for(const k of Object.keys(state.usuario.temaElo)){
    if(!validos.has(k)) delete state.usuario.temaElo[k];
  }
  for(const t of temasConfig){
    if(typeof state.usuario.temaElo[t.nombre] !== 'number'){
      state.usuario.temaElo[t.nombre] = META.eloStart;
    }
  }
  if(typeof state.usuario.eloGlobal !== 'number' || !isFinite(state.usuario.eloGlobal)){
    const elos = temasConfig
      .map(t => state.usuario.temaElo[t.nombre])
      .filter(v => typeof v === 'number' && isFinite(v));
    state.usuario.eloGlobal = elos.length
      ? elos.reduce((a, b) => a + b, 0) / elos.length
      : META.eloStart;
  }
}

/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 8b · SHUFFLE DE OPCIONES
   Baraja en el cliente. El gist mantiene el orden fijo original.
   ═══════════════════════════════════════════════════════════════ */
function shuffleOptionsWithAnswer(opts, correctIdx){
  const indices = opts.map((_, i) => i);
  /* Fisher–Yates */
  for(let i = indices.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  return {
    opts: indices.map(i => opts[i]),
    a: Math.max(0, indices.indexOf(correctIdx))
  };
}

   ═══════════════════════════════════════════════════════════════ */

function normalizarNombre(str){
  return String(str || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z]/g, '')
    .slice(0, 15);
}

function generarToken(nombreBruto){
  const base = normalizarNombre(nombreBruto);
  if(!base) throw new Error('Nombre inválido');
  const num = String(Math.floor(Math.random() * 90) + 10);
  const palabra = PALABRAS_TOKEN[Math.floor(Math.random() * PALABRAS_TOKEN.length)];
  return `${base}_${num}_${palabra}`;
}

function parsearToken(str){
  const m = String(str || '').trim().match(/^([a-z]+)_(\d{2})_([a-z]+)$/i);
  if(!m) return null;
  const nombre = m[1].toLowerCase();
  const num = m[2];
  const palabra = m[3].toLowerCase();
  return {
    nombre,
    nombreCorto: `${nombre}_${num}`,
    token: `${nombre}_${num}_${palabra}`
  };
}

async function listGistFiles(){
  if(!GIST_API_URL) return [];
  try{
    const resp = await fetch(GIST_API_URL, {
      headers: { 'Accept': 'application/vnd.github+json' }
    });
    if(!resp.ok) return [];
    const data = await resp.json();
    return Object.values(data.files || [])
      .filter(f =>
        /\.json$/i.test(f.filename) &&
        f.filename !== 'users.json' &&
        !f.filename.startsWith('_')       // ← excluye _problem-elo.json
      )
      .map(f => ({
        filename: f.filename,
        nombre: prettyName(f.filename),
        url: f.raw_url,
        size: f.size
      }));
  }catch(e){ return []; }
}

function prettyName(filename){
  return filename
    .replace(/\.json$/i, '')
    .replace(/[_-]+/g, ' ')
    .replace(/(^|\s)(\p{L})/gu, (_, sep, c) => sep + c.toUpperCase());
}

async function cargarDataset(){
  if(!REMOTE_URL){ throw new Error('Sin dataset remoto'); }

  const sep = REMOTE_URL.includes('?') ? '&' : '?';
  const resp = await fetchWithTimeout(REMOTE_URL + sep + '_=' + Date.now(), {cache:'no-store'}, 12000);
  if(!resp.ok) throw new Error('HTTP ' + resp.status);

  const dataset = JSON.parse(await resp.text());
  if(!dataset || !Array.isArray(dataset.problemas) || dataset.problemas.length === 0){
    throw new Error('Dataset vacío o inválido');
  }

  const userDatasets = (currentUser?.data?.datasets) || {};
  const saved = userDatasets[selectedFilename] || null;

  const usuario = saved?.usuario ? { ...saved.usuario } : defaultUsuario();
  if(!usuario.temaElo) usuario.temaElo = {};
  if(!Array.isArray(usuario.recent)) usuario.recent = [];

  const globalElos = await workerLoadProblemElos(selectedFilename);
  const problemas = dataset.problemas.map(p => ({
    ...p,
    elo: (typeof globalElos[p.id] === 'number') ? globalElos[p.id] : p.elo
  }));

  state = {
    version: 2,
    savedAt: null,
    datasetId: null,
    usuario,
    problemas,
    meta: dataset.meta,
    temas: dataset.temas
  };

  buildMeta(state);
  temasConfig = buildTemasConfig(state);
  ensureTemaElos();
}

function extractUserDataset(){
  return { usuario: state.usuario };
}

function renderLogin(){
  document.getElementById('app').innerHTML = `

    </div>
  `;
  const input = document.getElementById('loginInput');

async function handleLogin(value){
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';

  if(!value){
    errorEl.textContent = 'Ingresá un nombre o token';
    return;
  }

  const parsed = parsearToken(value);
  if(parsed){
    /* Parece token → intentar login */
    errorEl.textContent = 'Buscando usuario…';
    errorEl.style.color = 'var(--muted)';
    try{
      const userData = await workerLoadUser(parsed.token);
      if(!userData){
        errorEl.style.color = 'var(--bad)';
        errorEl.textContent = 'No existe ese usuario. ¿Quisiste crear uno nuevo? Probá solo con tu nombre.';
        return;
      }
      currentUser = { token: parsed.token, data: userData };
      try{ localStorage.setItem(USER_TOKEN_KEY, parsed.token); }catch(e){}
      errorEl.textContent = '';
      await entrarAlJuego();
    }catch(e){
      errorEl.style.color = 'var(--bad)';
      errorEl.textContent = 'Error: ' + e.message;
    }
    return;
  }

  /* Parece nombre → generar token */
  const nombre = normalizarNombre(value);
  if(!nombre || nombre.length < 2){
    errorEl.textContent = 'Nombre demasiado corto (mínimo 2 letras)';
    return;
  }

  let token;
  try{
    token = generarToken(value);
  }catch(e){
    errorEl.textContent = 'Nombre inválido';
    return;
  }

  const parsedNew = parsearToken(token);
  const userData = {
    nombre,
    nombreCorto: parsedNew.nombreCorto,
    createdAt: new Date().toISOString(),
    lastSeen: new Date().toISOString(),
    datasets: {}
  };

  renderTokenConfirmacion(token, userData);
}

function renderTokenConfirmacion(token, userData){
  document.getElementById('app').innerHTML = `
    <div class="login-screen">
      <div class="login-box">
        <h1>Guardá tu token</h1>
        <p class="login-sub">Esto es tu usuario y contraseña juntos.</p>
        <div class="token-display">
          <code id="tokenCode">${token}</code>
          <button id="copyBtn" class="copy-btn" title="Copiar">📋</button>
        </div>
        <p class="login-hint">
          <b>Anotalo bien.</b> Lo vas a necesitar para entrar desde otro
          dispositivo o después de borrar el navegador. Si lo perdés,
          perdés el acceso a tu progreso.
        </p>
        <button id="confirmBtn" class="login-btn">Ya lo anoté, entrar</button>
        <div id="loginError" class="login-error"></div>
      </div>
    </div>
  `;

  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(token)
      .then(() => showToast('📋 Token copiado'))
      .catch(() => showToast('No se pudo copiar, anotalo a mano', true));
  });

  document.getElementById('confirmBtn').addEventListener('click', async () => {
    const btn = document.getElementById('confirmBtn');
    const errorEl = document.getElementById('loginError');
    btn.disabled = true;
    btn.textContent = 'Guardando…';
    errorEl.textContent = '';

    try{
      await workerSaveUser(token, userData);
      currentUser = { token, data: userData };
      try{ localStorage.setItem(USER_TOKEN_KEY, token); }catch(e){}
      await entrarAlJuego();
    }catch(e){
      btn.disabled = false;
      btn.textContent = 'Ya lo anoté, entrar';
      errorEl.textContent = 'Error guardando: ' + e.message;
    }
  });
}

async function entrarAlJuego(){
  /* Cargar gist files */
  gistFiles = await listGistFiles();
  if(!gistFiles.length){
    document.getElementById('app').innerHTML = `
      <div class="loading">
        <div style="color:var(--bad);font-size:18px;font-weight:800">⚠ No se pudo cargar el gist</div>
        <div style="color:var(--muted);font-size:13px;text-align:center;max-width:460px;line-height:1.6">
          Revisá tu conexión o el ID del gist.<br>
          Gist ID: <code style="color:var(--accent)">${GIST_ID}</code>
        </div>
        <button class="mini-btn" onclick="location.reload()">🔄 Reintentar</button>
      </div>
    `;
    return;
  }

  /* Elegir dataset (guardado, o primero) */
  let savedFilename = null;
  try{ savedFilename = localStorage.getItem(SELECTED_DATASET_KEY); }catch(e){}
  const found = gistFiles.find(f => f.filename === savedFilename);
  selectedFilename = found ? found.filename : gistFiles[0].filename;
  REMOTE_URL = gistFiles.find(f => f.filename === selectedFilename).url;

  await cargarDataset();

  lastSavedAt = null;
  respuestasSinSync = 0;
  temaForzado = null;

  buildUI();
  updateSaveIndicator();
}

function logout(){
  if(!confirm('¿Cerrar sesión? Vas a necesitar tu token para volver a entrar.')) return;
  try{ localStorage.removeItem(USER_TOKEN_KEY); }catch(e){}
  currentUser = null;
  state = null;
  selectedFilename = null;
  respuestasSinSync = 0;
  renderLogin();
}

    try{ await saveUserProgress(true); }catch(e){}

  respuestasSinSync = 0;

  selectedFilename = filename;
  try{ localStorage.setItem(SELECTED_DATASET_KEY, filename); }catch(e){}

  const file = gistFiles.find(f => f.filename === filename);
  if(!file) return;
  REMOTE_URL = file.url;

  setDatasetBarLoading(true);
  try{
    await cargarDataset();
    temaForzado = null;
    lastSavedAt = null;
    buildUI();

function eloGlobal(){
  return (typeof state.usuario.eloGlobal === 'number' && isFinite(state.usuario.eloGlobal))
    ? state.usuario.eloGlobal : META.eloStart;
}

function expected(u, p){ return 1 / (1 + Math.pow(10, (p - u) / 400)); }

function rangoNombre(elo){
  const pct = (elo - META.eloMin) / (META.eloMax - META.eloMin);
  if(pct < 0.25) return 'Principiante';
  if(pct < 0.50) return 'Intermedio';
  if(pct < 0.75) return 'Avanzado';
  if(pct < 0.90) return 'Difícil';
  return 'Élite';
}

function tier(elo){
  const pct = (elo - META.eloMin) / (META.eloMax - META.eloMin);
  if(pct < 0.25) return {name:'Principiante', cls:''};
  if(pct < 0.50) return {name:'Intermedio',   cls:''};
  if(pct < 0.75) return {name:'Avanzado',     cls:''};
  if(pct < 0.90) return {name:'Difícil',      cls:''};
  return {name:'Élite', cls:'elite'};
}

function nombreProblema(p){
  return 'P' + String(p.id).padStart(2,'0') + ' · ' + p.tema;
}

function updateHUD(){
  const g = eloGlobal();
  document.getElementById('userElo').textContent = Math.round(g);
  document.getElementById('rankLabel').textContent = 'Rango: ' + rangoNombre(g);
  document.getElementById('record').textContent = state.usuario.wins + ' – ' + state.usuario.losses;
  document.getElementById('streak').textContent = state.usuario.streak > 0 ? '🔥 ' + state.usuario.streak : '0';
  document.getElementById('round').textContent = state.usuario.round + 1;
}

/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 18 · MATCHMAKING

function pickProblem(){
  let base = state.problemas;
  if(temaForzado) base = base.filter(p => temaDe(p) === temaForzado);
  if(base.length === 0) return state.problemas[0];

  const recent = state.usuario.recent || [];
  const recentSet = new Set(recent);
  const noVistos = base.filter(p => !recentSet.has(p.id));
  const umbralDuro = Math.min(base.length, Math.max(4, Math.floor(base.length * 0.3)));
  const pool = noVistos.length >= umbralDuro ? noVistos : base;

  const posReciente = new Map();
  recent.forEach((id, i) => posReciente.set(id, i));
  const N = Math.max(1, recent.length);

  const scored = pool.map(p => {
    const miElo = eloGlobal();
    const diffElo = Math.abs(p.elo - miElo);
    let repPenalty = 0;
    if(posReciente.has(p.id)){
      const pos = posReciente.get(p.id);
      repPenalty = 500 * (1 - pos / N);
    }
    return { p, score: diffElo + repPenalty };
  });

  scored.sort((a,b) => a.score - b.score);
  const candidatos = scored.slice(0, Math.min(4, scored.length));
  return candidatos[Math.floor(Math.random() * candidatos.length)].p;
}

function toggleTema(tema){
  if(temaForzado === tema){
    temaForzado = null;
    showToast('🎲 Modo aleatorio');
  } else {
    temaForzado = tema;
    showToast('🎯 Solo ' + tema);
  }
  updateFilterPill();
  renderRound();
}
/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 18b · MINI MARKDOWN (para teoría / solución)
   Soporta: encabezados #, **negrita**, listas - * + y 1.
   Protege segmentos LaTeX ($…$, $$…$$, \(…\), \[…\]) para
   que MathJax los procese luego.
   ═══════════════════════════════════════════════════════════════ */
function mdLite(src){
  if(src == null) return '';
  let s = String(src);

  /* 1) Proteger LaTeX */
  const mathSegs = [];
  s = s.replace(
    /\$\$[\s\S]*?\$\$|\$[^$\n]+?\$|\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g,
    m => { mathSegs.push(m); return `\u0000M${mathSegs.length - 1}\u0000`; }
  );

  /* 2) Encabezados */
  s = s.replace(/^[ \t]*######[ \t]+(.+)$/gm, '<h6>$1</h6>');
  s = s.replace(/^[ \t]*#####[ \t]+(.+)$/gm,  '<h5>$1</h5>');
  s = s.replace(/^[ \t]*####[ \t]+(.+)$/gm,   '<h4>$1</h4>');
  s = s.replace(/^[ \t]*###[ \t]+(.+)$/gm,    '<h4>$1</h4>');
  s = s.replace(/^[ \t]*##[ \t]+(.+)$/gm,     '<h4>$1</h4>');
  s = s.replace(/^[ \t]*#[ \t]+(.+)$/gm,      '<h4>$1</h4>');

  /* 3) **negrita**  y  *itálica*  y  `código` */
  s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+?)\*(?=[\s.,;:!?)]|$)/g, '$1<em>$2</em>');
  s = s.replace(/`([^`\n]+?)`/g, '<code>$1</code>');

  /* 4) Listas y párrafos */
  const lines = s.split(/\r?\n/);
  const out = [];
  let listType = null;
  const closeList = () => { if(listType){ out.push(`</${listType}>`); listType = null; } };

  for(const line of lines){
    const t = line.trim();
    if(!t){ closeList(); continue; }
    if(/^<h[1-6][ >]/i.test(t)){ closeList(); out.push(t); continue; }

    let m;
    if((m = t.match(/^[-*+]\s+(.+)$/))){
      if(listType !== 'ul'){ closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push('<li>' + m[1] + '</li>');
    } else if((m = t.match(/^\d+\.\s+(.+)$/))){
      if(listType !== 'ol'){ closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push('<li>' + m[1] + '</li>');
    } else {
      closeList();
      out.push(t + '<br>');
    }
  }
  closeList();

  let html = out.join('\n');
  /* 5) Limpieza de <br> redundantes */
  html = html.replace(/<br>\s*(<h[1-6][ >])/gi, '$1');
  html = html.replace(/<br>\s*(<ul>|<ol>)/gi, '$1');
  html = html.replace(/(<\/(?:ul|ol|h[1-6])>)\s*<br>/gi, '$1');
  html = html.replace(/(<br>\s*)+$/gi, '');

  /* 6) Restaurar LaTeX */
  html = html.replace(/\u0000M(\d+)\u0000/g, (_, i) => mathSegs[+i]);
  return html;
}

function renderRound(){
  answered = false;
  current = pickProblem();
  const temaActual = temaDe(current);

  const pElo = current.elo;

    '<div class="q">' + current.q + '</div>';

const cont = document.getElementById('options');
cont.innerHTML = '';
currentShuffled = shuffleOptionsWithAnswer(current.opts, current.a);
currentShuffled.opts.forEach((op, i) => {
  const b = document.createElement('button');
  b.className = 'opt';
  b.innerHTML = '<span class="letter">' + 'ABCDEFGH'[i] + '</span><span class="txt">' + op + '</span>';
  b.addEventListener('click', () => responder(i));
  cont.appendChild(b);
});

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('nextBtn').hidden = true;

  updateHUD();
  drawRadar(temaActual);
  renderLegend(temaActual);

  typesetMath(pText);
  typesetMath(cont);
}

function responder(indice){
  if(answered) return;
  answered = true;

  const temaActual = temaDe(current);
  const acierto = (indice === currentShuffled.a);
  const pEloAntes = current.elo;
  const uTemaAntes = state.usuario.temaElo[temaActual] ?? META.eloStart;
  const S = acierto ? 1 : 0;

  const gAntes  = eloGlobal();
  const E_g     = expected(gAntes, pEloAntes);
  const dGlobal = META.kUser * (S - E_g);
  state.usuario.eloGlobal = gAntes + dGlobal;

  const brecha    = gAntes - uTemaAntes;
  const absBrecha = Math.abs(brecha);
  const boost = 1 + Math.min(K_BOOST_MAX, absBrecha / K_BOOST_RANGO);
  const kTema = META.kUser * boost;

  let dConv = 0;
  if(absBrecha > CONV_UMBRAL){
    const exceso = absBrecha - CONV_UMBRAL;
    dConv = Math.sign(brecha) * CONV_FACTOR * exceso;
  }

  const E = expected(uTemaAntes, pEloAntes);
  const dUser = kTema * (S - E) + dConv;
  const uTemaDespues = uTemaAntes + dUser;
  state.usuario.temaElo[temaActual] = uTemaDespues;

  /* ─── ELO global del problema ─── */
  current.elo = pEloAntes + META.kProb * ((1 - S) - (1 - E));
  workerSendProblemElo(selectedFilename, current.id, current.elo);

  state.usuario.round += 1;
  if(acierto){
    state.usuario.wins++;
    state.usuario.streak++;
    state.usuario.best = Math.max(state.usuario.best, state.usuario.streak);
  } else {
    state.usuario.losses++;
    state.usuario.streak = 0;
  }

  if(!state.usuario.recent) state.usuario.recent = [];
  state.usuario.recent.unshift(current.id);
  const maxRecent = Math.min(RECENT_HISTORY_MAX, Math.max(8, Math.floor(state.problemas.length * 0.7)));
  if(state.usuario.recent.length > maxRecent){
    state.usuario.recent.length = maxRecent;
  }

  lastSavedAt = new Date();
  respuestasSinSync++;

  const botones = [...document.querySelectorAll('.opt')];
  botones.forEach((b, i) => {
    b.disabled = true;
    if(i === currentShuffled.a) b.classList.add('correct');
    else if(i === indice) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const fb = document.getElementById('feedback');
  const signoU = dUser >= 0 ? '+' : '';
  const signoP = (current.elo - pEloAntes) >= 0 ? '+' : '';
  fb.className = 'feedback show ' + (acierto ? 'win' : 'lose');

  const color = colorDe(temaActual);
  let html =
    '<div class="title">' +
      (acierto ? '✅ ¡Victoria! Le ganaste al problema.' : '❌ Derrota. El problema te ganó.') +
    '</div>' +
    '<div class="sol">' + mdLite(current.sol) + '</div>';

  if(!acierto && current.teoria){
    const t = (typeof current.teoria === 'string')
      ? { titulo: 'Teoría', texto: current.teoria } : current.teoria;
    html +=
      '<div class="teoria">' +
        '<div class="teoria-title">' + mdLite(t.titulo) + '</div>' +
        '<div class="teoria-body">' + mdLite(t.texto) + '</div>' +
      '</div>';
  }

  html +=
    '<div class="elo-line">' +
      '<span class="tema-chip" style="border-color:' + color + '55; color:' + color + '">' + temaActual + '</span>' +
      '<span>Tema: <b>' + Math.round(uTemaAntes) + '</b> → <b>' + Math.round(uTemaDespues) + '</b> ' +
      '(<b class="' + (dUser >= 0 ? 'up' : 'down') + '">' + signoU + dUser.toFixed(1) + '</b>)</span>' +
      '<span>Rival (global): ' + Math.round(pEloAntes) + ' → ' + Math.round(current.elo) +
      ' (<b class="' + ((current.elo - pEloAntes) >= 0 ? 'up' : 'down') + '">' + signoP + (current.elo - pEloAntes).toFixed(1) + '</b>)</span>' +
    '</div>';

  fb.innerHTML = html;
  typesetMath(fb);

  const dEl = document.getElementById('userDelta');
  dEl.textContent = (dGlobal >= 0 ? '+' : '') + dGlobal.toFixed(0);
  dEl.className = 'delta show ' + (dGlobal >= 0 ? 'up' : 'down');
  clearTimeout(dEl.__to);
  dEl.__to = setTimeout(() => { dEl.className = 'delta'; }, 25000);

  updateHUD();
  drawRadar(temaActual);
  renderLegend(temaActual);
  document.getElementById('nextBtn').hidden = false;
  document.getElementById('nextBtn').focus();
}

/* ═══════════════════════════════════════════════════════════════
   SECCIÓN 20 · RADAR
   ═══════════════════════════════════════════════════════════════ */

function getRadarRange(){
  const elos = temasConfig
    .map(t => state.usuario.temaElo[t.nombre])
    .filter(v => typeof v === 'number' && isFinite(v));
  if(elos.length === 0) return { min: META.eloMin, max: META.eloMax };

  const dataMin = Math.min(...elos);
  const dataMax = Math.max(...elos);
  const dataSpan = dataMax - dataMin;
  const margin = Math.max(30, dataSpan * 0.15);
  return {
    min: Math.floor((dataMin - margin) / 10) * 10,
    max: Math.ceil((dataMax + margin) / 10) * 10
  };
}

function wrapText(ctx, text, maxWidth){
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  for(const w of words){
    const test = cur ? cur + ' ' + w : w;
    if(ctx.measureText(test).width <= maxWidth || !cur) cur = test;
    else { lines.push(cur); cur = w; }
  }
  if(cur) lines.push(cur);
  return lines.length ? lines : [String(text)];
}

function drawRadar(highlightTema = null){
  const canvas = document.getElementById('radar');
  if(!canvas) return;
  const size = canvas.clientWidth;
  if(!size) return;

  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  canvas.style.height = size + 'px';

  const ctx = canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, size, size);

  const n = temasConfig.length;
  if(n === 0) return;

  const cx = size/2, cy = size/2;
  const maxR = size * 0.28;
  const N = META.nRings;

  const range = getRadarRange();
  const rangeMin = range.min;
  const rangeMax = range.max;
  const rangeSpan = rangeMax - rangeMin;

  const angles = temasConfig.map((_, i) => -Math.PI/2 + i * 2*Math.PI / n);

  for(let ring = 1; ring <= N; ring++){
    const r = maxR * ring / N;
    ctx.beginPath();
    angles.forEach((a, i) => {
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.strokeStyle = 'rgba(120,170,255,' + (ring === N ? .30 : .10) + ')';
    ctx.lineWidth = ring === N ? 1.3 : 1;
    ctx.stroke();
  }

  angles.forEach((a, i) => {
    const isHi = highlightTema && temasConfig[i].nombre === highlightTema;
    const isForced = temaForzado && temasConfig[i].nombre === temaForzado;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * maxR, cy + Math.sin(a) * maxR);
    if(isForced) ctx.strokeStyle = 'rgba(63,185,80,.75)';
    else if(isHi) ctx.strokeStyle = temasConfig[i].color + 'cc';
    else ctx.strokeStyle = 'rgba(120,170,255,.13)';
    ctx.lineWidth = (isForced || isHi) ? 1.8 : 1;
    if(isForced || isHi) ctx.setLineDash([4,3]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  const pts = temasConfig.map((t, i) => {
    const elo = state.usuario.temaElo[t.nombre] ?? rangeMin;
    const norm = Math.max(0.02, Math.min(1, (elo - rangeMin) / rangeSpan));
    const r = maxR * norm;
    return { x: cx + Math.cos(angles[i]) * r, y: cy + Math.sin(angles[i]) * r, i };
  });

  ctx.beginPath();
  pts.forEach((p, i) => { if(i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.closePath();

  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
  grad.addColorStop(0,   'rgba(120,200,255,.45)');
  grad.addColorStop(0.6, 'rgba(140,140,255,.28)');
  grad.addColorStop(1,   'rgba(163,113,247,.15)');
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.strokeStyle = '#7cc4ff';
  ctx.lineWidth = 2.2;
  ctx.shadowColor = 'rgba(88,166,255,.6)';
  ctx.shadowBlur = 14;
  ctx.stroke();
  ctx.shadowBlur = 0;

  pts.forEach(p => {
    const color = temasConfig[p.i].color;
    const isForced = temaForzado && temasConfig[p.i].nombre === temaForzado;
    ctx.beginPath();
    ctx.arc(p.x, p.y, isForced ? 6.5 : 5, 0, 2*Math.PI);
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = isForced ? 18 : 12;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, isForced ? 6.5 : 5, 0, 2*Math.PI);
    ctx.strokeStyle = isForced ? '#8fdf9c' : '#fff';
    ctx.lineWidth = isForced ? 2 : 1.6;
    ctx.stroke();
  });

  ctx.font = '700 11px "Segoe UI", system-ui, sans-serif';
  ctx.textBaseline = 'middle';
  const LINE_H = 13;
  const LABEL_GAP = 16;

  temasConfig.forEach((t, i) => {
    const a = angles[i];
    const ca = Math.cos(a);
    const lx = cx + Math.cos(a) * (maxR + LABEL_GAP);
    const ly = cy + Math.sin(a) * (maxR + LABEL_GAP);

    let align = 'center';
    if(ca > 0.35) align = 'left';
    else if(ca < -0.35) align = 'right';
    ctx.textAlign = align;

    let maxW;
    if(align === 'left')       maxW = size - lx - 4;
    else if(align === 'right') maxW = lx - 4;
    else                       maxW = 2 * Math.min(lx, size - lx) - 8;
    if(maxW < 40) maxW = 40;

    let lines = wrapText(ctx, t.nombre, maxW);
    lines = lines.map(line => {
      if(ctx.measureText(line).width <= maxW) return line;
      let s = line;
      while(s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
      return s + '…';
    });

    const isHi = highlightTema === t.nombre;
    const isForced = temaForzado === t.nombre;
    ctx.fillStyle = isForced ? '#8fdf9c' : isHi ? t.color : 'rgba(233,239,247,.82)';

    const totalH = lines.length * LINE_H;
    const startY = ly - (totalH - LINE_H) / 2;
    lines.forEach((line, li) => {
      ctx.fillText(line, lx, startY + li * LINE_H);
    });
  });

  ctx.font = '700 10px "Segoe UI", system-ui, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';

  const txt = String(Math.round(rangeMax / 10) * 10);
  const w = ctx.measureText(txt).width;
  const labelX = cx;
  const labelY = cy - maxR;

  ctx.fillStyle = 'rgba(10,16,26,.90)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(labelX - w/2 - 7, labelY - 8, w + 14, 16, 5);
  else ctx.rect(labelX - w/2 - 7, labelY - 8, w + 14, 16);
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,170,255,.30)';
  ctx.lineWidth = 0.9;
  ctx.stroke();

  ctx.fillStyle = 'rgba(200,212,228,.95)';
  ctx.fillText(txt, labelX, labelY);
}

function renderLegend(highlightTema = null){
  const cont = document.getElementById('legend');
  if(!cont) return;
  cont.innerHTML = '';

  temasConfig.forEach(t => {
    const elo = state.usuario.temaElo[t.nombre] ?? META.eloStart;
    const diff = elo - META.eloStart;
    const signo = diff > 0 ? '+' : '';

    const div = document.createElement('div');
    let cls = 'lg-item';
    if(highlightTema === t.nombre) cls += ' hi';
    if(temaForzado === t.nombre) cls += ' active';
    div.className = cls;
    div.title = temaForzado === t.nombre
      ? 'Click para quitar el filtro'
      : 'Click para practicar solo ' + t.nombre;

    div.innerHTML =
      '<span class="lg-dot" style="color:' + t.color + '"></span>' +
      '<span class="lg-name">' + t.nombre + '</span>' +
      '<span class="lg-val">' + Math.round(elo) +
        '<small>(' + signo + diff.toFixed(0) + ')</small>' +
        '<span class="lg-check">✓</span>' +
      '</span>';

    div.addEventListener('click', () => toggleTema(t.nombre));
    cont.appendChild(div);
  });

  const sub = document.getElementById('perfilSub');
  if(sub){
    if(temaForzado){
      sub.innerHTML = '🎯 Filtrando <b>' + temaForzado + '</b> · click para quitar';
      sub.classList.add('filter-active');
    } else {
      sub.innerHTML = 'Click en un tema para filtrar';
      sub.classList.remove('filter-active');
    }
  }
}

/* Mini Markdown: encabezados, **negrita**, listas -/*/+ y 1.,
   respeta $...$ y $$...$$ de MathJax. */
function mdLite(src){
  if(src == null) return '';
  let s = String(src);

  /* Proteger LaTeX */
  const mathSegs = [];
  s = s.replace(
    /\$\$[\s\S]*?\$\$|\$[^$\n]+?\$|\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g,
    m => { mathSegs.push(m); return `\u0000M${mathSegs.length - 1}\u0000`; }
  );

  /* Encabezados */
  s = s.replace(/^[ \t]*######[ \t]+(.+)$/gm, '<h6>$1</h6>');
  s = s.replace(/^[ \t]*#####[ \t]+(.+)$/gm,  '<h5>$1</h5>');
  s = s.replace(/^[ \t]*####[ \t]+(.+)$/gm,   '<h4>$1</h4>');
  s = s.replace(/^[ \t]*###[ \t]+(.+)$/gm,    '<h4>$1</h4>');
  s = s.replace(/^[ \t]*##[ \t]+(.+)$/gm,     '<h4>$1</h4>');
  s = s.replace(/^[ \t]*#[ \t]+(.+)$/gm,      '<h4>$1</h4>');

  /* Negrita **texto** */
  s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');

  /* Listas + saltos de línea */
  const lines = s.split(/\r?\n/);
  const out = [];
  let listType = null;
  const closeList = () => { if(listType){ out.push(`</${listType}>`); listType = null; } };

  for(const line of lines){
    const t = line.trim();
    if(!t){ closeList(); continue; }
    if(/^<h[1-6][ >]/i.test(t)){ closeList(); out.push(t); continue; }

    let m;
    if((m = t.match(/^[-*+]\s+(.+)$/))){
      if(listType !== 'ul'){ closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push('<li>' + m[1] + '</li>');
    } else if((m = t.match(/^\d+\.\s+(.+)$/))){
      if(listType !== 'ol'){ closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push('<li>' + m[1] + '</li>');
    } else {
      closeList();
      out.push(t + '<br>');
    }
  }
  closeList();

  let html = out.join('\n');
  /* Quitar <br> redundantes junto a bloques */
  html = html.replace(/<br>\s*(<h[1-6][ >])/gi, '$1');
  html = html.replace(/<br>\s*(<ul>|<ol>)/gi, '$1');
  html = html.replace(/(<\/(?:ul|ol|h[1-6])>)\s*<br>/gi, '$1');
  html = html.replace(/(<br>\s*)+$/gi, '');

  /* Restaurar LaTeX */
  html = html.replace(/\u0000M(\d+)\u0000/g, (_, i) => mathSegs[+i]);
  return html;
}

function showToast(msg, isError = false){
  let t = document.getElementById('__toast');
  if(!t){ t = document.createElement('div'); t.id = '__toast'; document.body.appendChild(t); }
  t.style.cssText = `
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:rgba(20,26,36,.96);color:#e9eff7;padding:11px 20px;border-radius:12px;
    border:1px solid ${isError ? 'rgba(248,81,73,.55)' : 'rgba(88,166,255,.35)'};
    font-size:13px;z-index:1200;max-width:min(560px,90vw);text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.5);backdrop-filter:blur(12px);
    opacity:0;transition:.28s ease;pointer-events:none;font-weight:600;
  `;
  t.textContent = msg;
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t.__to);
  t.__to = setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(20px)';
  }, isError ? 4200 : 2600);
}

document.addEventListener('keydown', (e) => {
  /* Si no hay app (login screen), no procesar teclas de juego */
  if(!state || !current) return;
  if(!answered && ['1','2','3','4','5','6','7','8'].includes(e.key)){
    const i = parseInt(e.key) - 1;
    const botones = [...document.querySelectorAll('.opt')];
    if(botones[i]) botones[i].click();
  } else if(answered && (e.key === 'Enter' || e.key === ' ')){
    e.preventDefault();
    const nb = document.getElementById('nextBtn');
    if(nb && !nb.hidden) nb.click();
  }
});

let resizeTO = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTO);
  resizeTO = setTimeout(() => {
    if(!state) return;
    if(current) drawRadar(temaDe(current));
    else drawRadar();
  }, 100);
});

(async function init(){
  /* Intentar auto-login con token guardado */
  let savedToken = null;
  try{ savedToken = localStorage.getItem(USER_TOKEN_KEY); }catch(e){}

  if(savedToken){
    try{
      const userData = await workerLoadUser(savedToken);
      if(userData){
        currentUser = { token: savedToken, data: userData };
        await entrarAlJuego();
        return;
      } else {
        /* Token guardado ya no existe → limpiar */
        try{ localStorage.removeItem(USER_TOKEN_KEY); }catch(e){}
      }
    }catch(e){
      console.warn('Auto-login falló:', e);
      /* No limpiamos el token: puede ser un error de red */
    }
  }

  /* Sin sesión → mostrar login */
  renderLogin();
})();

async function reloadDataset(){
  if(!selectedFilename){ showToast('No hay dataset configurado', true); return; }

  if(respuestasSinSync > 0 && currentUser){
    try{ await saveUserProgress(true); }catch(e){}
  }
  respuestasSinSync = 0;

  const btn = document.getElementById('reloadBtn');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ Recargando…'; }

  try{
    await cargarDataset();
    buildUI();
    showToast('🔄 Recargado · ' + state.problemas.length + ' problemas (ELOs globales al día)');
  }catch(e){
    console.warn('Error recargando:', e);
    showToast('No se pudo recargar: ' + (e.message || e), true);
  } finally {
    const b = document.getElementById('reloadBtn');
    if(b){ b.disabled = false; b.textContent = '🔄 Recargar'; }
  }
}
